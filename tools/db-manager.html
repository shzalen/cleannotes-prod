<script>
const App = {
  // ── State ──
  port: 3579,
  baseUrl: '',
  connections: [],
  activeConnId: null,
  currentDB: '',
  connected: false,
  editingId: null,
  activeTab: 'results',
  currentTable: '',
  pendingDangerSQL: null,
  cachedResultHTML: null,
  lastResultData: null,
  contextRowIndex: undefined,

  // ── Undo/Redo ──
  undoStack: [],
  redoStack: [],
  _undoDebounce: null,

  // ── Autocomplete ──
  _acVisible: false,
  _acIndex: 0,
  _acItems: [],
  _acToken: '',
  _acTableMeta: {},   // { tableName: [columnName, ...] }

  // ── SQL Keywords (autocomplete) ──
  _sqlKeywords: [
    'SELECT','FROM','WHERE','INSERT','INTO','VALUES','UPDATE','SET','DELETE',
    'CREATE','TABLE','ALTER','DROP','INDEX','VIEW','TRIGGER','PROCEDURE','FUNCTION',
    'JOIN','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL JOIN','CROSS JOIN','ON',
    'GROUP BY','ORDER BY','HAVING','LIMIT','OFFSET','UNION','UNION ALL','DISTINCT',
    'AS','AND','OR','NOT','IN','BETWEEN','LIKE','IS NULL','IS NOT NULL','EXISTS',
    'COUNT','SUM','AVG','MAX','MIN','COALESCE','NULLIF','CAST','CONVERT',
    'CASE','WHEN','THEN','ELSE','END','IF','IFNULL','NVL','ISNULL',
    'ASC','DESC','NULLS FIRST','NULLS LAST','TOP','PERCENT','WITH','RECURSIVE',
    'PRIMARY KEY','FOREIGN KEY','REFERENCES','UNIQUE','CHECK','DEFAULT','NOT NULL',
    'CASCADE','RESTRICT','NO ACTION','SET NULL','SET DEFAULT',
    'BEGIN','COMMIT','ROLLBACK','SAVEPOINT','TRANSACTION',
    'GRANT','REVOKE','DENY','EXEC','EXECUTE','CALL',
    'VARCHAR','INT','BIGINT','DECIMAL','NUMERIC','FLOAT','DOUBLE','BOOLEAN',
    'DATE','DATETIME','TIMESTAMP','TIME','TEXT','BLOB','JSON','UUID','GUID',
    'TRUNCATE','RENAME','MERGE','REPLACE','UPSERT',
    'OVER','PARTITION BY','ROW_NUMBER','RANK','DENSE_RANK','LAG','LEAD',
    'INNER','OUTER','LEFT','RIGHT','FULL','NATURAL','CROSS',
    'SCHEMA','DATABASE','SEQUENCE','TABLESPACE','SYNONYM',
    'IDENTITY','AUTO_INCREMENT','SERIAL','GENERATED','ALWAYS','BY','INCREMENT',
    'CHAR','NCHAR','NVARCHAR','CLOB','NCLOB','XML','GEOMETRY','GEOGRAPHY',
  ],

  // ── Snippets ──
  snippets: {
    ssf:  (t) => t === 'mssql' ? 'SELECT TOP 100 * FROM ' : 'SELECT * FROM ',
    sf:   (t) => 'SELECT * FROM ',
    sc:   (t) => 'SELECT COUNT(*) FROM ',
    si:   (t) => 'SELECT * FROM [cursor] WHERE [column] = [value]',
    su:   (t) => 'SELECT DISTINCT ',
    sw:   (t) => 'SELECT * FROM [cursor] WHERE ',
    s100: (t) => t === 'mssql' ? 'SELECT TOP 100 * FROM ' : 'SELECT * FROM ',
    sto:  (t) => t === 'mssql' ? 'SELECT TOP 100 * FROM ' : 'SELECT * FROM ',
    ii:   (t) => 'INSERT INTO [cursor] ([columns]) VALUES ([values])',
    iu:   (t) => 'UPDATE [cursor] SET [column] = [value] WHERE ',
    df:   (t) => 'DELETE FROM [cursor] WHERE ',
    ct:   (t) => 'CREATE TABLE [cursor] (\n  [id] INT PRIMARY KEY,\n  [column] VARCHAR(255)\n)',
    al:   (t) => 'ALTER TABLE [cursor] ADD [column] VARCHAR(255)',
    dt:   (t) => 'DROP TABLE [cursor]',
    cj:   (t) => 'INNER JOIN [cursor] ON [a].[id] = [b].[id]',
    lj:   (t) => 'LEFT JOIN [cursor] ON [a].[id] = [b].[id]',
    gb:   (t) => 'GROUP BY ',
    ob:   (t) => 'ORDER BY ',
    obd:  (t) => 'ORDER BY [cursor] DESC',
    lm:   (t) => t === 'mssql' ? 'SELECT TOP 10 * FROM ' : 'SELECT * FROM [cursor] LIMIT 10',
    ex:   (t) => 'EXEC sp_helptext ',
    all:  (t) => 'SELECT * FROM ',
  },

  // ── Init ──
  init() {
    const params = new URLSearchParams(location.search);
    this.port = parseInt(params.get('port')) || 3579;
    this.baseUrl = `http://localhost:${this.port}`;

    // Set header port input and handle port switch
    const portInput = document.getElementById('header-port');
    portInput.value = this.port;
    portInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const newPort = parseInt(portInput.value);
        if (newPort > 1024 && newPort < 65536 && newPort !== this.port) {
          window.location.href = `http://localhost:${newPort}/?port=${newPort}`;
        }
      }
    });

    this.connections = JSON.parse(localStorage.getItem('db-manager-conns') || '[]');
    this.renderConnList();
    this.renderConnSelect();
    this.initEditor();
    this.initResizers();
    this.initFullscreen();

    const lastId = localStorage.getItem('db-manager-last');
    if (lastId) {
      this.activeConnId = lastId;
      document.getElementById('conn-select').value = lastId;
    }
    this.checkServer();
  },

  // ── Server Health ──
  async checkServer() {
    try {
      const res = await fetch(`${this.baseUrl}/api/health`);
      if (res.ok) {
        this.setServerOnline(true);
        this.log('message', `API 服务已就绪 (${this.baseUrl})`, 'success');
      } else {
        this.setServerOnline(false);
      }
    } catch(e) {
      this.setServerOnline(false);
      this.log('message', `无法连接到 API 服务 (${this.baseUrl})，请确认 db-manager.exe 已启动`, 'error');
    }
  },

  // ── API Helper ──
  async api(endpoint, body) {
    const res = await fetch(`${this.baseUrl}${endpoint}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  },

  // ── Connection Management ──
  getActiveConn() {
    return this.connections.find(c => c.id === this.activeConnId);
  },

  onConnectionSelect() {
    this.activeConnId = document.getElementById('conn-select').value;
    if (this.activeConnId) {
      localStorage.setItem('db-manager-last', this.activeConnId);
    }
    this.renderConnList();
    this.disconnect();
  },

  openConnModal(id) {
    this.editingId = id || null;
    const modal = document.getElementById('conn-modal');
    document.getElementById('modal-title').textContent = id ? '编辑连接' : '新增连接';
    if (id) {
      const conn = this.connections.find(c => c.id === id);
      if (conn) {
        document.getElementById('f-name').value = conn.name;
        document.getElementById('f-type').value = conn.dbType;
        document.getElementById('f-host').value = conn.host;
        document.getElementById('f-port').value = conn.port;
        document.getElementById('f-user').value = conn.user;
        document.getElementById('f-pass').value = conn.password || '';
        document.getElementById('f-db').value = conn.database || '';
      }
    } else {
      document.getElementById('f-name').value = '';
      document.getElementById('f-type').value = 'mysql';
      document.getElementById('f-host').value = 'localhost';
      document.getElementById('f-port').value = '3306';
      document.getElementById('f-user').value = '';
      document.getElementById('f-pass').value = '';
      document.getElementById('f-db').value = '';
    }
    this.onTypeChange();
    modal.classList.add('show');
  },

  closeConnModal() {
    document.getElementById('conn-modal').classList.remove('show');
    this.editingId = null;
  },

  onTypeChange() {
    const type = document.getElementById('f-type').value;
    const portMap = {mysql: 3306, pgsql: 5432, mssql: 1433};
    document.getElementById('f-port').value = portMap[type] || 3306;
  },

  saveConnection() {
    const conn = {
      id: this.editingId || ('conn_' + Date.now()),
      name: document.getElementById('f-name').value.trim() || '未命名连接',
      dbType: document.getElementById('f-type').value,
      host: document.getElementById('f-host').value.trim() || 'localhost',
      port: parseInt(document.getElementById('f-port').value) || 3306,
      user: document.getElementById('f-user').value.trim(),
      password: document.getElementById('f-pass').value,
      database: document.getElementById('f-db').value.trim()
    };
    if (this.editingId) {
      const idx = this.connections.findIndex(c => c.id === this.editingId);
      if (idx >= 0) this.connections[idx] = conn;
    } else {
      this.connections.push(conn);
    }
    localStorage.setItem('db-manager-conns', JSON.stringify(this.connections));
    this.renderConnList();
    this.renderConnSelect();
    this.closeConnModal();
    if (!this.editingId) {
      this.activeConnId = conn.id;
      localStorage.setItem('db-manager-last', conn.id);
      document.getElementById('conn-select').value = conn.id;
      this.renderConnList();
    }
    this.log('message', `连接 "${conn.name}" 已保存`, 'success');
  },

  deleteConnection(id) {
    const conn = this.connections.find(c => c.id === id);
    if (!confirm(`确定删除连接 "${conn?.name || ''}" 吗？`)) return;
    this.connections = this.connections.filter(c => c.id !== id);
    localStorage.setItem('db-manager-conns', JSON.stringify(this.connections));
    if (this.activeConnId === id) {
      this.activeConnId = null;
      this.disconnect();
    }
    this.renderConnList();
    this.renderConnSelect();
    this.log('message', `连接已删除`, 'info');
  },

  renderConnList() {
    const list = document.getElementById('conn-list');
    list.innerHTML = '';
    this.connections.forEach(conn => {
      const item = document.createElement('div');
      item.className = 'conn-item' + (conn.id === this.activeConnId ? ' active' : '');
      item.innerHTML = `
        <span class="conn-type type-${conn.dbType}">${conn.dbType}</span>
        <span class="conn-name" title="${conn.host}:${conn.port}">${conn.name}</span>
        <div class="conn-actions">
          <button class="icon-btn" onclick="event.stopPropagation();App.openConnModal('${conn.id}')" title="编辑">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn" onclick="event.stopPropagation();App.deleteConnection('${conn.id}')" title="删除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      `;
      item.onclick = () => {
        this.activeConnId = conn.id;
        localStorage.setItem('db-manager-last', conn.id);
        document.getElementById('conn-select').value = conn.id;
        this.renderConnList();
      };
      list.appendChild(item);
    });
  },

  renderConnSelect() {
    const sel = document.getElementById('conn-select');
    const current = sel.value;
    sel.innerHTML = '<option value="">— 选择连接 —</option>';
    this.connections.forEach(conn => {
      const opt = document.createElement('option');
      opt.value = conn.id;
      opt.textContent = `${conn.name} (${conn.dbType})`;
      sel.appendChild(opt);
    });
    sel.value = current;
  },

  // ── Connection Operations ──
  async connectToDB() {
    const conn = this.getActiveConn();
    if (!conn) { alert('请先选择一个连接'); return; }
    this.showLoading('正在连接...');
    try {
      const data = await this.api('/api/connect', {
        dbType: conn.dbType,
        host: conn.host,
        port: conn.port,
        user: conn.user,
        password: conn.password,
        database: conn.database || (conn.dbType === 'mysql' ? 'mysql' : conn.dbType === 'pgsql' ? 'postgres' : 'master')
      });
      if (data.ok) {
        this.setConnected(true);
        this.log('message', `连接成功: ${conn.name} (${conn.host}:${conn.port})`, 'success');
        await this.loadDatabases();
      } else {
        this.setConnected(false);
        this.log('message', `连接失败: ${data.error}`, 'error');
      }
    } catch(e) {
      this.setConnected(false);
      this.log('message', `请求失败: ${e.message}`, 'error');
    }
    this.hideLoading();
  },

  setConnected(connected) {
    this.connected = connected;
    const dot = document.getElementById('db-status-dot');
    const text = document.getElementById('db-status-text');
    const btnDisc = document.getElementById('btn-disconnect');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnExec = document.getElementById('btn-execute');
    if (connected) {
      dot.className = 'db-status-dot connected';
      text.textContent = '已连接';
      btnDisc.disabled = false;
      btnRefresh.disabled = false;
      btnExec.disabled = false;
    } else {
      dot.className = 'db-status-dot';
      text.textContent = '未连接';
      btnDisc.disabled = true;
      btnRefresh.disabled = true;
      btnExec.disabled = true;
    }
  },

  setServerOnline(online) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (online) {
      dot.className = 'dot connected';
      text.textContent = '在线中';
    } else {
      dot.className = 'dot';
      text.textContent = '未连接';
    }
  },

  disconnect() {
    if (!confirm('确定要断开当前数据库连接吗？')) return;
    this.setConnected(false);
    this.currentDB = '';
    document.getElementById('tree-container').innerHTML = '';
    this.log('message', '已断开连接', 'info');
  },

  async refreshTree() {
    if (this.connected) await this.loadDatabases();
  },

  // ── Database Tree ──
  async loadDatabases() {
    const conn = this.getActiveConn();
    if (!conn) return;
    this.showLoading('加载数据库列表...');
    try {
      const data = await this.api('/api/databases', {
        dbType: conn.dbType,
        host: conn.host,
        port: conn.port,
        user: conn.user,
        password: conn.password,
        database: conn.database || ''
      });
      if (data.error) {
        this.log('message', `加载失败: ${data.error}`, 'error');
        this.hideLoading(); return;
      }
      this.renderTree(data.databases || []);
      this.log('message', `加载 ${data.databases?.length || 0} 个数据库`, 'success');
    } catch(e) {
      this.log('message', `请求失败: ${e.message}`, 'error');
    }
    this.hideLoading();
  },

  renderTree(databases) {
    const container = document.getElementById('tree-container');
    container.innerHTML = '';
    databases.forEach(db => {
      const node = document.createElement('div');
      node.className = 'tree-node';
      node.innerHTML = `
        <div class="tree-label" onclick="App.toggleDB(this, '${db}')">
          <span class="chevron">▶</span>
          <span class="tree-icon">🗄️</span>
          <span class="tree-text">${db}</span>
        </div>
        <div class="tree-children"></div>
      `;
      container.appendChild(node);
    });
  },

  async toggleDB(labelEl, dbName) {
    const children = labelEl.nextElementSibling;
    const isExpanded = children.classList.contains('expanded');
    if (isExpanded) {
      children.classList.remove('expanded');
      labelEl.classList.remove('expanded');
      return;
    }
    // Close other databases
    document.querySelectorAll('.tree-children.expanded').forEach(el => {
      el.classList.remove('expanded');
      el.previousElementSibling?.classList.remove('expanded');
    });
    labelEl.classList.add('expanded');
    children.classList.add('expanded');
    this.currentDB = dbName;

    // Build 3 category groups with loading placeholders
    children.innerHTML = `
      <div class="tree-node category-node" data-cat="tables">
        <div class="tree-label cat-label expanded" onclick="App.toggleCategory(this,'tables')">
          <span class="chevron">▶</span>
          <span class="tree-icon">📋</span>
          <span class="tree-text">表</span>
          <span class="cat-count" id="cat-count-tables">…</span>
        </div>
        <div class="tree-children expanded cat-children" id="cat-children-tables">
          <div style="padding:6px 20px;font-size:11px;color:var(--text-3)">加载中...</div>
        </div>
      </div>
      <div class="tree-node category-node" data-cat="views">
        <div class="tree-label cat-label expanded" onclick="App.toggleCategory(this,'views')">
          <span class="chevron">▶</span>
          <span class="tree-icon">👁</span>
          <span class="tree-text">视图</span>
          <span class="cat-count" id="cat-count-views">…</span>
        </div>
        <div class="tree-children expanded cat-children" id="cat-children-views">
          <div style="padding:6px 20px;font-size:11px;color:var(--text-3)">加载中...</div>
        </div>
      </div>
      <div class="tree-node category-node" data-cat="procedures">
        <div class="tree-label cat-label expanded" onclick="App.toggleCategory(this,'procedures')">
          <span class="chevron">▶</span>
          <span class="tree-icon">📦</span>
          <span class="tree-text">存储过程</span>
          <span class="cat-count" id="cat-count-procedures">…</span>
        </div>
        <div class="tree-children expanded cat-children" id="cat-children-procedures">
          <div style="padding:6px 20px;font-size:11px;color:var(--text-3)">加载中...</div>
        </div>
      </div>`;

    const conn = this.getActiveConn();
    if (!conn) return;

    try {
      const [tablesData, procData] = await Promise.all([
        this.api('/api/tables', {
          dbType: conn.dbType, host: conn.host, port: conn.port,
          user: conn.user, password: conn.password, database: dbName
        }),
        this.api('/api/procedures', {
          dbType: conn.dbType, host: conn.host, port: conn.port,
          user: conn.user, password: conn.password, database: dbName
        })
      ]);

      const allTables = tablesData.tables || [];
      const tableList = allTables.filter(t => t.type !== 'view');
      const viewList = allTables.filter(t => t.type === 'view');
      const procList = (procData.procedures || []).map(n => ({ name: n, type: 'procedure' }));

      this._renderCategoryItems('tables', tableList);
      this._renderCategoryItems('views', viewList);
      this._renderCategoryItems('procedures', procList);
    } catch(e) {
      ['tables','views','procedures'].forEach(cat => {
        const el = document.getElementById('cat-children-' + cat);
        if (el) el.innerHTML = `<div style="padding:8px 20px;font-size:11px;color:var(--danger)">${e.message}</div>`;
      });
    }
  },

  toggleCategory(labelEl, cat) {
    const children = labelEl.nextElementSibling;
    children.classList.toggle('expanded');
    labelEl.classList.toggle('expanded');
  },

  _renderCategoryItems(cat, items) {
    const container = document.getElementById('cat-children-' + cat);
    const countEl = document.getElementById('cat-count-' + cat);
    if (!container || !countEl) return;
    countEl.textContent = items.length;
    container.innerHTML = '';
    if (items.length === 0) return; // CSS :empty::after shows placeholder

    items.forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node';
      let icon, clickHandler, ctxHandler;
      if (cat === 'procedures') {
        icon = '📄';
        clickHandler = `App.selectProcedure('${this.currentDB}', '${item.name.replace(/'/g, "\\'")}')`;
        ctxHandler = '';
      } else {
        icon = cat === 'views' ? '👁' : '📋';
        clickHandler = `App.selectTable(this, '${this.currentDB}', '${item.name.replace(/'/g, "\\'")}')`;
        ctxHandler = `oncontextmenu="App.onTableContextMenu(event, '${this.currentDB}', '${item.name.replace(/'/g, "\\'")}')"`;
      }
      const dragAttr = cat === 'procedures' ? '' : `draggable="true" ondragstart="App._onTableDragStart(event,'${item.name.replace(/'/g, "\\'")}')"`;
      let title = item.name;
      if (item.comment) title += ' \u2014 ' + item.comment;
      node.innerHTML = `
        <div class="tree-label" onclick="${clickHandler}" ${ctxHandler} ${dragAttr}>
          <span style="width:14px"></span>
          <span class="tree-icon">${icon}</span>
          <span class="tree-text" title="${title.replace(/"/g, '&quot;')}">${item.name}</span>
        </div>
      `;
      container.appendChild(node);
    });
  },

  async selectProcedure(dbName, procName) {
    document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
    // Find and highlight the procedure node
    const procNodes = document.querySelectorAll('#cat-children-procedures .tree-label');
    procNodes.forEach(n => {
      const txt = n.querySelector('.tree-text');
      if (txt && txt.textContent === procName) n.classList.add('active');
    });
    this.currentTable = procName;
    this.currentDB = dbName;

    const conn = this.getActiveConn();
    if (!conn) return;
    this.showLoading('加载存储过程...');
    try {
      const data = await this.api('/api/procedure-source', {
        dbType: conn.dbType, host: conn.host, port: conn.port,
        user: conn.user, password: conn.password, database: dbName,
        table: procName
      });
      if (data.error) {
        this.renderError(data.error);
      } else {
        const editor = document.getElementById('sql-editor');
        this._captureUndoState();
        editor.value = data.source || `-- 无法获取 ${procName} 的源代码`;
        this.checkDangerSQL();
        this._syncHighlight();
        this.switchTab('messages');
        this.log('message', `已加载存储过程: ${procName}`, 'success');
      }
    } catch(e) {
      this.renderError(e.message);
    }
    this.hideLoading();
  },

  filterTables() {
    const query = (document.getElementById('table-search')?.value || '').toLowerCase();
    const containers = document.querySelectorAll('.cat-children.expanded');
    containers.forEach(container => {
      const nodes = container.querySelectorAll('.tree-node');
      nodes.forEach(node => {
        const label = node.querySelector('.tree-label .tree-text');
        if (!label) return;
        const name = (label.textContent || '').toLowerCase();
        node.style.display = (!query || name.includes(query)) ? '' : 'none';
      });
    });
  },

  _onTableDragStart(e, tableName) {
    e.dataTransfer.setData('text/plain', tableName);
    e.dataTransfer.effectAllowed = 'copy';
    // 设置拖拽预览文本
    e.dataTransfer.setDragImage ? null : null; // 使用默认预览
  },

  async selectTable(labelEl, dbName, tableName) {
    document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
    labelEl.classList.add('active');
    this.currentTable = tableName;
    this.currentDB = dbName;
    await this.loadStructure(dbName, tableName);
    this.switchTab('structure');
  },

  // ── Load Table Structure ──
  async loadStructure(dbName, tableName) {
    const conn = this.getActiveConn();
    if (!conn) { this.renderStructure([], ''); return; }
    try {
      const data = await this.api('/api/columns', {
        dbType: conn.dbType,
        host: conn.host,
        port: conn.port,
        user: conn.user,
        password: conn.password,
        database: dbName,
        table: tableName
      });
      if (data.error) {
        this.renderError(data.error);
        this.log('exec', `加载表结构失败: ${data.error}`, 'error');
        this.renderStructure([], '');
        return;
      }
      this.renderStructure(data.columns || [], data.table_comment || '');
    } catch(e) {
      this.renderError(e.message);
      this.log('exec', `加载表结构异常: ${e.message}`, 'error');
      this.renderStructure([], '');
    }
  },

  renderStructure(columns, tableComment) {
    this.structData = columns;
    this.structTableComment = tableComment || '';
    // 缓存列名用于 autocomplete
    if (this.currentTable && columns.length > 0) {
      this._acTableMeta[this.currentTable] = columns.map(c => c.name);
    }
    if (this.activeTab === 'structure') this.renderStructureTab();
  },

  renderStructureTab() {
    const body = document.getElementById('result-body');
    const columns = this.structData || [];
    if (columns.length === 0) {
      body.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div>暂无表结构数据</div><div class="empty-hint">点击左侧表名查看结构</div></div>';
      return;
    }
    let html = '<div class="struct-header">';
    html += `<h3>${this.escapeHtml(this.currentTable || '')}</h3>`;
    if (this.structTableComment) {
      html += `<p class="struct-comment">${this.escapeHtml(this.structTableComment)}</p>`;
    }
    html += '</div>';
    html += '<table class="struct-table"><thead><tr>';
    html += '<th>列名</th><th>类型</th><th>可空</th><th>默认值</th><th>主键</th><th>自增</th><th>注释</th>';
    html += '</tr></thead><tbody>';
    columns.forEach(col => {
      html += '<tr>';
      html += `<td><strong>${this.escapeHtml(col.name)}</strong></td>`;
      html += `<td>${this.escapeHtml(col.type)}</td>`;
      html += `<td>${col.nullable === 'YES' ? '<span style="color:var(--success)">YES</span>' : '<span style="color:var(--text-3)">NO</span>'}</td>`;
      html += `<td style="color:var(--text-3)">${col.default ? this.escapeHtml(col.default) : '—'}</td>`;
      html += `<td>${col.is_pk ? '<span class="badge-pk">PK</span>' : ''}</td>`;
      html += `<td>${col.auto_inc ? '<span class="badge-ai">AI</span>' : ''}</td>`;
      html += `<td style="color:var(--text-3);font-size:11px">${col.comment ? this.escapeHtml(col.comment) : ''}</td>`;
      html += '</tr>';
    });
    html += '</tbody></table>';
    body.innerHTML = html;
  },

  // ── Danger SQL Detection ──
  getDangerLevel(sql) {
    const upper = sql.toUpperCase();
    // DROP / TRUNCATE / ALTER — always dangerous
    if (/\bDROP\b/.test(upper)) return { level: 'high', type: 'DROP' };
    if (/\bTRUNCATE\b/.test(upper)) return { level: 'high', type: 'TRUNCATE' };
    if (/\bALTER\b/.test(upper)) return { level: 'high', type: 'ALTER' };
    // UPDATE / DELETE — dangerous only without WHERE
    if (/\bDELETE\b/.test(upper)) {
      if (!/\bWHERE\b/.test(upper)) return { level: 'high', type: 'DELETE (无 WHERE)' };
      return { level: 'medium', type: 'DELETE' };
    }
    if (/\bUPDATE\b/.test(upper)) {
      if (!/\bWHERE\b/.test(upper)) return { level: 'high', type: 'UPDATE (无 WHERE)' };
      return { level: 'medium', type: 'UPDATE' };
    }
    return null;
  },

  // ── Smart Statement Splitting ──
  // 优先按 ; 拆分；若无分号则按常见 SQL 语句关键字行首智能拆分
  _splitStatements(sql) {
    // ── 辅助：获取位置 i 处的完整 token（用于关键字匹配）──
    const getTokenAt = (s, i) => {
      let end = i;
      while (end < s.length && /[A-Za-z0-9_]/.test(s[end])) end++;
      return s.substring(i, end);
    };

    // ── 字符级扫描，追踪 字符串/注释/分号/行首关键字 ──
    const boundaries = [0]; // 字符位置边界
    const len = sql.length;
    let i = 0;
    // 追踪当前行的第一个非空白字符位置
    let lineStart = 0;
    let firstNonSpaceInLine = -1;

    while (i < len) {
      const ch = sql[i];
      const next = sql[i + 1] || '';

      // ── 换行：记录行首位置 ──
      if (ch === '\n' || ch === '\r') {
        // 跳过 \r\n
        if (ch === '\r' && next === '\n') i++;
        i++;
        lineStart = i;
        firstNonSpaceInLine = -1;
        continue;
      }

      // ── 跟踪当前行第一个非空白字符位置 ──
      if (firstNonSpaceInLine === -1 && !/\s/.test(ch)) {
        firstNonSpaceInLine = i;
      }

      // ── 单行注释 --（跳过到行尾）──
      if (ch === '-' && next === '-') {
        i += 2;
        while (i < len && sql[i] !== '\n' && sql[i] !== '\r') i++;
        continue;
      }

      // ── 块注释 /* ... */ ──
      if (ch === '/' && next === '*') {
        i += 2;
        while (i < len - 1 && !(sql[i] === '*' && sql[i + 1] === '/')) i++;
        i += 2; // 跳过 */
        continue;
      }

      // ── 单引号字符串 '...' ──
      if (ch === "'") {
        i++;
        while (i < len) {
          if (sql[i] === '\\') { i += 2; continue; }
          if (sql[i] === "'") { i++; break; }
          i++;
        }
        continue;
      }

      // ── 双引号字符串 "..." ──
      if (ch === '"') {
        i++;
        while (i < len) {
          if (sql[i] === '\\') { i += 2; continue; }
          if (sql[i] === '"') { i++; break; }
          i++;
        }
        continue;
      }

      // ── 分号（仅在非注释/非字符串区域生效）──
      if (ch === ';') {
        boundaries.push(i + 1); // 分号之后为新语句起点
        i++;
        continue;
      }

      // ── 行首关键字检测（无分号时的智能拆分）──
      if (i === firstNonSpaceInLine && boundaries.length > 0 && i > boundaries[0]) {
        const token = getTokenAt(sql, i).toUpperCase();
        const kwSet = new Set([
          'SELECT', 'INSERT', 'UPDATE', 'DELETE', 'CREATE', 'ALTER', 'DROP',
          'TRUNCATE', 'EXEC', 'EXECUTE', 'WITH', 'DECLARE', 'SET', 'GO', 'USE'
        ]);
        if (kwSet.has(token)) {
          // INSERT INTO / DELETE FROM 需要双词匹配
          if (token === 'INSERT' || token === 'DELETE') {
            let j = i + token.length;
            while (j < len && /\s/.test(sql[j])) j++;
            const nextToken = getTokenAt(sql, j).toUpperCase();
            if ((token === 'INSERT' && nextToken === 'INTO') ||
                (token === 'DELETE' && nextToken === 'FROM')) {
              boundaries.push(i);
            }
          } else {
            boundaries.push(i);
          }
        }
      }

      i++;
    }

    // ── 按边界提取语句 ──
    if (boundaries.length === 1) return { statements: [sql.trim()], smartSplit: false };

    // 添加末尾边界
    boundaries.push(len);

    const parts = [];
    for (let b = 0; b < boundaries.length - 1; b++) {
      const part = sql.substring(boundaries[b], boundaries[b + 1]).trim();
      // 跳过纯空白、纯分号或纯注释的片段
      if (part && part !== ';') {
        // 跳过以分号开头的残留（分号边界已切分，中间可能有残留分号）
        const cleaned = part.replace(/^;+\s*/, '').trim();
        if (cleaned) parts.push(cleaned);
      }
    }

    if (parts.length === 0) return { statements: [sql.trim()], smartSplit: false };

    // 有 ; 拆分 → smartSplit=false；否则为智能拆分
    const hasSemicolon = sql.includes(';');
    return { statements: parts, smartSplit: !hasSemicolon && parts.length > 1 };
  },

  checkDangerSQL() {
    const editor = document.getElementById('sql-editor');
    const sql = this.getSQLToExecute();
    // 扫描所有语句，任一危险即标记
    const { statements: stmts } = this._splitStatements(sql);
    let maxDanger = null;
    for (const stmt of stmts) {
      const d = this.getDangerLevel(stmt);
      if (d && (!maxDanger || d.level === 'high' || (d.level === 'medium' && maxDanger.level !== 'high'))) {
        maxDanger = d;
      }
    }
    const banner = document.getElementById('danger-banner');
    const msgEl = document.getElementById('danger-msg');

    if (maxDanger) {
      editor.classList.add('danger-sql');
      banner.classList.add('show');
      if (maxDanger.level === 'high') {
        msgEl.textContent = `⚠️ 检测到危险操作: ${maxDanger.type} — 执行前需要确认`;
      } else {
        msgEl.textContent = `⚠️ 检测到数据修改操作: ${maxDanger.type} — 请确认 SQL 无误`;
      }
    } else {
      editor.classList.remove('danger-sql');
      banner.classList.remove('show');
    }
    return maxDanger;
  },

  getSQLToExecute() {
    const editor = document.getElementById('sql-editor');
    let sql = editor.value.substring(editor.selectionStart, editor.selectionEnd).trim();
    if (!sql) sql = editor.value.trim();
    return sql;
  },

  closeDangerModal() {
    document.getElementById('danger-modal').classList.remove('show');
    this.pendingDangerSQL = null;
  },

  confirmDangerSQL() {
    document.getElementById('danger-modal').classList.remove('show');
    const sql = this.pendingDangerSQL;
    this.pendingDangerSQL = null;
    if (sql) this._doExecuteSQL(sql);
  },

  // ── SQL Execution ──
  async executeSQL() {
    const conn = this.getActiveConn();
    if (!conn) { alert('请先选择并连接数据库'); return; }
    if (!this.currentDB) { alert('请先在左侧选择一个数据库'); return; }
    const sql = this.getSQLToExecute();
    if (!sql) return;

    // 逐条检查危险级别（多语句场景需分别判断）
    const { statements: stmts, smartSplit } = this._splitStatements(sql);
    let danger = null;
    for (const stmt of stmts) {
      const d = this.getDangerLevel(stmt);
      if (d && (!danger || d.level === 'high' || (d.level === 'medium' && danger.level !== 'high'))) {
        danger = d;
      }
    }

    if (danger) {
      // Show danger confirmation for ALL levels
      const hintEl = document.getElementById('danger-hint');
      const codeEl = document.getElementById('danger-code');
      const btnEl = document.getElementById('btn-danger-confirm');

      if (danger.level === 'high') {
        if (danger.type.includes('无 WHERE')) {
          hintEl.innerHTML = `<strong>检测到 ${danger.type} 操作！</strong><br><br>该语句<strong>没有 WHERE 条件</strong>，将影响表中所有数据。<br>这是一个不可逆的操作，请仔细确认。`;
        } else {
          hintEl.innerHTML = `<strong>检测到危险操作: ${danger.type}</strong><br><br>该操作可能造成数据丢失，请仔细确认。`;
        }
        btnEl.textContent = '我确认，执行';
      } else {
        hintEl.innerHTML = `<strong>检测到数据修改操作: ${danger.type}</strong><br><br>该操作将修改数据库中的数据，请确认是否继续。`;
        btnEl.textContent = '确认执行';
      }
      codeEl.textContent = sql;
      this.pendingDangerSQL = sql;
      document.getElementById('danger-modal').classList.add('show');
      return;
    }

    this._doExecuteSQL(sql);
  },

  async _doExecuteSQL(sql) {
    const conn = this.getActiveConn();
    if (!conn) return;

    // 拆分语句（优先 ; 分隔，无分号时智能拆分）
    const { statements, smartSplit } = this._splitStatements(sql);
    if (statements.length === 0) return;

    this.showLoading('执行中...');
    this.switchTab('results');

    // 智能拆分提示
    if (smartSplit && statements.length > 1) {
      this.log('message', `未检测到分号(;)，已按语句关键字自动拆分为 ${statements.length} 条依次执行。建议每条语句以 ; 结尾以获得精确控制。`, 'info');
    }

    const allResults = [];
    let totalElapsed = 0;

    for (let i = 0; i < statements.length; i++) {
      const stmt = statements[i];
      // 更新 loading 提示（多语句场景）
      if (statements.length > 1) {
        this.showLoading(`执行中... (${i + 1}/${statements.length})`);
      }
      try {
        const data = await this.api('/api/execute', {
          dbType: conn.dbType,
          host: conn.host,
          port: conn.port,
          user: conn.user,
          password: conn.password,
          database: this.currentDB,
          sql: stmt
        });
        totalElapsed += parseFloat(data.elapsed) || 0;
        allResults.push({ statement: stmt, data, error: null });
      } catch(e) {
        allResults.push({ statement: stmt, data: null, error: e.message });
      }
    }

    this.hideLoading();

    // 判断是否多语句
    if (statements.length === 1) {
      // 单语句：保持原有渲染路径
      const r = allResults[0];
      if (r.error) {
        this.renderError(r.error);
        this.log('exec', `执行失败: ${r.error}`, 'error');
      } else if (r.data.columns && r.data.columns.length > 0) {
        this.renderResults(r.data);
        this.log('exec', `查询成功: ${r.data.rows ? r.data.rows.length : 0} 行 · 耗时 ${r.data.elapsed}`, 'success');
      } else {
        this.renderNonQueryResult(r.data);
        this.log('exec', `执行成功: 影响 ${r.data.rowsAffected || 0} 行 · 耗时 ${r.data.elapsed}`, 'success');
      }
    } else {
      // 多语句：堆叠显示
      this.renderMultiResults(allResults);
      const totalRows = allResults.reduce((sum, r) => sum + (r.data && r.data.rows ? r.data.rows.length : 0), 0);
      const totalAffected = allResults.reduce((sum, r) => sum + (r.data ? (r.data.rowsAffected || 0) : 0), 0);
      const failedCount = allResults.filter(r => r.error).length;
      const okCount = allResults.length - failedCount;
      let logMsg = `${okCount}/${allResults.length} 条语句执行成功`;
      if (totalRows > 0) logMsg += ` · ${totalRows} 行`;
      if (totalAffected > 0) logMsg += ` · 影响 ${totalAffected} 行`;
      if (failedCount > 0) logMsg += ` · ${failedCount} 条失败`;
      logMsg += ` · 总耗时 ${totalElapsed.toFixed(2)}ms`;
      this.log('exec', logMsg, failedCount > 0 ? 'warn' : 'success');
    }
  },

  renderResults(data) {
    const body = document.getElementById('result-body');
    if (!data.columns || data.columns.length === 0) {
      this.renderNonQueryResult(data);
      return;
    }
    const rows = data.rows || [];
    this.lastResultData = { columns: data.columns, rows: rows };
    document.getElementById('badge-results').textContent = rows.length;

    let html = this._buildResultTable(data);
    html += `<div style="padding:6px 12px;font-size:11px;color:var(--text-3);border-top:1px solid var(--border)">
      ${rows.length} 行 · 耗时 ${data.elapsed}${rows.length >= 1000 ? ' (已限制 1000 行)' : ''}
    </div>`;
    this.cachedResultHTML = html;
    body.innerHTML = html;
  },

  renderError(msg) {
    const body = document.getElementById('result-body');
    body.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">❌</div>
        <div style="color:var(--danger)">执行错误</div>
        <div class="empty-hint" style="color:var(--danger);white-space:pre-wrap;max-width:600px">${msg}</div>
      </div>`;
    document.getElementById('badge-results').textContent = '0';
  },

  // 非查询结果（INSERT/UPDATE/DELETE 等）
  renderNonQueryResult(data) {
    const body = document.getElementById('result-body');
    const html = `
      <div class="empty-state">
        <div class="empty-icon">✅</div>
        <div>执行成功</div>
        <div class="empty-hint">影响 ${data.rowsAffected || 0} 行 · 耗时 ${data.elapsed}</div>
      </div>`;
    this.cachedResultHTML = html;
    body.innerHTML = html;
    document.getElementById('badge-results').textContent = '0';
  },

  // 多语句堆叠显示
  renderMultiResults(allResults) {
    const body = document.getElementById('result-body');
    const totalRows = allResults.reduce((sum, r) => sum + ((r.data && r.data.rows) ? r.data.rows.length : 0), 0);
    document.getElementById('badge-results').textContent = totalRows;

    let html = '';
    allResults.forEach((r, idx) => {
      html += '<div class="result-stmt-block">';

      // 语句头部
      const stmtPreview = r.statement.length > 80 ? r.statement.substring(0, 80) + '...' : r.statement;
      if (r.error) {
        html += `<div class="result-stmt-header">
          <span class="stmt-label">语句 ${idx + 1}</span>
          <code title="${this.escapeAttr(r.statement)}">${this.escapeHtml(stmtPreview)}</code>
          <span class="stmt-err">❌ 执行失败</span>
        </div>`;
        html += `<div class="empty-state" style="height:auto;padding:16px">
          <div style="color:var(--danger);white-space:pre-wrap;font-size:12px;max-width:600px">${this.escapeHtml(r.error)}</div>
        </div>`;
      } else if (r.data.columns && r.data.columns.length > 0) {
        const rows = r.data.rows || [];
        html += `<div class="result-stmt-header">
          <span class="stmt-label">语句 ${idx + 1}</span>
          <code title="${this.escapeAttr(r.statement)}">${this.escapeHtml(stmtPreview)}</code>
          <span class="stmt-ok">✓ ${rows.length} 行 · ${r.data.elapsed}</span>
        </div>`;
        html += this._buildResultTable(r.data);
      } else {
        html += `<div class="result-stmt-header">
          <span class="stmt-label">语句 ${idx + 1}</span>
          <code title="${this.escapeAttr(r.statement)}">${this.escapeHtml(stmtPreview)}</code>
          <span class="stmt-ok">✓ 影响 ${r.data.rowsAffected || 0} 行 · ${r.data.elapsed}</span>
        </div>`;
      }

      html += '</div>';
    });
    this.cachedResultHTML = html;
    body.innerHTML = html;
  },

  // 提取表格 HTML 构建（复用于单语句和多语句）
  _buildResultTable(data) {
    const cols = data.columns;
    const rows = data.rows || [];
    const pkCols = new Set();
    if (this.structData) {
      this.structData.forEach(c => { if (c.is_pk) pkCols.add(c.name); });
    }
    let h = '<table class="result-table"><thead><tr>';
    h += '<th class="col-num">#</th>';
    cols.forEach(col => {
      const isPK = pkCols.has(col);
      h += `<th>${col}${isPK ? ' <span class="th-type">🔑PK</span>' : ''}</th>`;
    });
    h += '</tr></thead><tbody>';
    rows.forEach((row, idx) => {
      const rowKey = row[0] !== undefined ? String(row[0]) : idx;
      h += `<tr data-row-index="${idx}" data-row-key="${rowKey.replace(/"/g,'&quot;')}" oncontextmenu="App.onRowContextMenu(event, this)">`;
      h += `<td class="col-num">${idx + 1}</td>`;
      row.forEach(val => {
        if (val === null || val === undefined) {
          h += '<td class="null-val">NULL</td>';
        } else if (typeof val === 'number') {
          h += `<td class="num-val">${val}</td>`;
        } else {
          const escaped = String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          h += `<td title="${escaped}">${escaped}</td>`;
        }
      });
      h += '</tr>';
    });
    if (rows.length === 0) {
      h += `<tr><td class="col-num"></td><td colspan="${cols.length}" style="text-align:center;padding:20px;color:var(--text-3)">查询返回 0 行</td></tr>`;
    }
    h += '</tbody></table>';
    return h;
  },

  escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  },

  escapeAttr(str) {
    return String(str).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  },

  // ── Editor ──
  initEditor() {
    const editor = document.getElementById('sql-editor');
    editor.addEventListener('keydown', (e) => {
      // Ctrl+Z / Cmd+Z: Undo
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        this.undo();
        return;
      }
      // Ctrl+Y / Ctrl+Shift+Z / Cmd+Shift+Z: Redo
      if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
        e.preventDefault();
        this.redo();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        this.executeSQL();
      }
      if (e.key === 'Tab' || e.key === ' ') {
        // Tab/Enter: autocomplete 优先
        if (this._acVisible && e.key === 'Tab') {
          e.preventDefault();
          this._acApply(editor);
          return;
        }
        const result = this.expandSnippet(editor);
        if (result) {
          e.preventDefault();
          editor.selectionStart = editor.selectionEnd = result.cursorPos;
        } else if (e.key === 'Tab') {
          e.preventDefault();
          this._captureUndoState();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
          editor.selectionStart = editor.selectionEnd = start + 2;
        }
      }
      // Enter: 如有 autocomplete 可见则优先应用
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        if (this._acVisible) {
          e.preventDefault();
          this._acApply(editor);
          return;
        }
        e.preventDefault();
        this.executeSQL();
      }
      // Autocomplete 导航键
      if (this._acVisible) {
        if (e.key === 'ArrowDown') { e.preventDefault(); this._acMove(1); return; }
        if (e.key === 'ArrowUp')   { e.preventDefault(); this._acMove(-1); return; }
        if (e.key === 'Escape')    { e.preventDefault(); this._acClose(); return; }
        if (e.key === 'Enter')     { e.preventDefault(); this._acApply(editor); return; }
      }
    });
    // Check danger + undo debounce + highlight on input
    editor.addEventListener('input', () => {
      this._pushUndoDebounced();
      this.checkDangerSQL();
      this._syncHighlight();
    });
    // Sync scroll to highlight layer
    editor.addEventListener('scroll', () => {
      const hl = document.getElementById('sql-highlight');
      if (hl) { hl.scrollTop = editor.scrollTop; hl.scrollLeft = editor.scrollLeft; }
    });
    editor.addEventListener('keyup', () => {
      this.checkDangerSQL();
      this._acShow(editor);
      const pos = editor.selectionStart;
      const text = editor.value.substring(0, pos);
      const line = text.split('\n').length;
      const col = pos - text.lastIndexOf('\n');
      document.getElementById('editor-pos').textContent = `Ln ${line}, Col ${col}`;
    });
    editor.addEventListener('click', () => {
      this._acClose();
      const pos = editor.selectionStart;
      const text = editor.value.substring(0, pos);
      const line = text.split('\n').length;
      const col = pos - text.lastIndexOf('\n');
      document.getElementById('editor-pos').textContent = `Ln ${line}, Col ${col}`;
    });

    // ── 拖放表名到编辑器 ──
    const editorWrap = editor.closest('.editor-wrap');
    if (editorWrap) {
      editorWrap.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        editorWrap.classList.add('drag-over');
      });
      editorWrap.addEventListener('dragleave', () => {
        editorWrap.classList.remove('drag-over');
      });
      editorWrap.addEventListener('drop', (e) => {
        e.preventDefault();
        editorWrap.classList.remove('drag-over');
        const tableName = e.dataTransfer.getData('text/plain');
        if (!tableName) return;
        this._captureUndoState();
        this._insertAtCursor(tableName);
        this.checkDangerSQL();
        this._syncHighlight();
        editor.focus();
      });
    }
  },

  _insertAtCursor(text) {
    const editor = document.getElementById('sql-editor');
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    editor.value = editor.value.substring(0, start) + text + editor.value.substring(end);
    editor.selectionStart = editor.selectionEnd = start + text.length;
  },

  // ── Syntax Highlighting ──
  _hlCache: null,

  _buildHlCache() {
    // Build a Set of uppercase keywords for fast lookup
    const s = new Set();
    this._sqlKeywords.forEach(k => s.add(k.toUpperCase()));
    // Also add all uppercase single-word forms (e.g., "LEFT JOIN" → "LEFT","JOIN")
    this._sqlKeywords.forEach(k => k.split(/\s+/).forEach(w => s.add(w)));
    this._hlCache = s;
  },

  _highlightSQL(text) {
    if (!text) return '';
    if (!this._hlCache) this._buildHlCache();
    const kw = this._hlCache;
    // Escape HTML entities first
    let out = '';
    let i = 0;
    const len = text.length;

    const push = (cls, s) => {
      const escaped = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      if (cls) out += `<span class="${cls}">${escaped}</span>`;
      else out += escaped;
    };

    while (i < len) {
      // 1) Line comment: --
      if (text[i] === '-' && text[i+1] === '-') {
        let end = text.indexOf('\n', i);
        if (end === -1) end = len;
        push('hl-cmt', text.substring(i, end));
        i = end;
        continue;
      }
      // 2) Block comment: /* ... */
      if (text[i] === '/' && text[i+1] === '*') {
        let end = text.indexOf('*/', i + 2);
        if (end === -1) end = len; else end += 2;
        push('hl-cmt', text.substring(i, end));
        i = end;
        continue;
      }
      // 3) Single-quoted string
      if (text[i] === "'") {
        let end = i + 1;
        while (end < len) {
          if (text[end] === "'" && text[end+1] === "'") { end += 2; continue; }
          if (text[end] === "'") { end++; break; }
          end++;
        }
        push('hl-str', text.substring(i, end));
        i = end;
        continue;
      }
      // 4) Number (standalone)
      if (/\d/.test(text[i]) && (i === 0 || /[\s,;()+\-*/<>=]/.test(text[i-1]))) {
        let end = i;
        while (end < len && /[\d.]/.test(text[end])) end++;
        push('hl-num', text.substring(i, end));
        i = end;
        continue;
      }
      // 5) Word — check if keyword or function-like
      if (/[a-zA-Z_]/.test(text[i])) {
        let end = i;
        while (end < len && /[a-zA-Z0-9_]/.test(text[end])) end++;
        const word = text.substring(i, end);
        const upper = word.toUpperCase();
        if (kw.has(upper)) {
          push('hl-kw', word);
        } else if (end < len && text[end] === '(') {
          push('hl-fn', word);
        } else {
          push(null, word);
        }
        i = end;
        continue;
      }
      // 6) Operators
      if ('<>!=+-*/%'.includes(text[i])) {
        push('hl-op', text[i]);
        i++;
        continue;
      }
      // 7) Plain text
      push(null, text[i]);
      i++;
    }
    return out;
  },

  _syncHighlight() {
    const editor = document.getElementById('sql-editor');
    const hl = document.getElementById('sql-highlight');
    if (!editor || !hl) return;
    hl.scrollTop = editor.scrollTop;
    hl.scrollLeft = editor.scrollLeft;
    const code = hl.querySelector('code');
    if (code) {
      // Append newline so trailing empty line is visible (textarea behavior)
      const t = editor.value.endsWith('\n') ? editor.value + ' ' : editor.value;
      code.innerHTML = this._highlightSQL(t);
    }
  },

  // ── Autocomplete ──
  _getAcDropdown() {
    let dd = document.getElementById('ac-dropdown');
    if (!dd) {
      dd = document.createElement('div');
      dd.id = 'ac-dropdown';
      dd.className = 'ac-dropdown';
      document.body.appendChild(dd);
    }
    return dd;
  },

  _acClose() {
    this._acVisible = false;
    this._acIndex = 0;
    this._acItems = [];
    const dd = document.getElementById('ac-dropdown');
    if (dd) dd.style.display = 'none';
  },

  _acMove(dir) {
    if (!this._acItems.length) return;
    this._acIndex = (this._acIndex + dir + this._acItems.length) % this._acItems.length;
    this._acRenderDropdown();
  },

  _acApply(editor) {
    if (!this._acVisible || !this._acItems.length) return;
    const item = this._acItems[this._acIndex];
    if (!item) return;
    this._captureUndoState();
    const textBefore = editor.value.substring(0, editor.selectionStart);
    // 找到 token 起始位置
    const lastDelim = Math.max(
      textBefore.lastIndexOf(' '), textBefore.lastIndexOf('\n'), textBefore.lastIndexOf('\t'),
      textBefore.lastIndexOf(','), textBefore.lastIndexOf('('), textBefore.lastIndexOf(')'),
      textBefore.lastIndexOf(';')
    );
    const prefix = textBefore.substring(lastDelim + 1);
    const replace = item.replaceStr || item.label;
    // 替换 token
    editor.value = textBefore.substring(0, lastDelim + 1) + replace + editor.value.substring(editor.selectionStart);
    const newPos = lastDelim + 1 + replace.length;
    editor.selectionStart = editor.selectionEnd = newPos;
    this._acClose();
    this.checkDangerSQL();
    this._syncHighlight();
    editor.focus();
  },

  _acRenderDropdown() {
    const dd = this._getAcDropdown();
    if (!this._acItems.length) { dd.style.display = 'none'; return; }
    let html = '';
    for (let i = 0; i < this._acItems.length; i++) {
      const item = this._acItems[i];
      const sel = i === this._acIndex ? ' class="ac-selected"' : '';
      html += `<div${sel} data-ac-idx="${i}">${this.escapeHtml(item.label)}<span class="ac-desc">${this.escapeHtml(item.desc || '')}</span></div>`;
    }
    dd.innerHTML = html;
    dd.style.display = 'block';
    // Scroll selected into view
    const sel = dd.querySelector('.ac-selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  },

  _acShow(editor) {
    const conn = this.getActiveConn();
    const pos = editor.selectionStart;
    const textBefore = editor.value.substring(0, pos);
    // Extract current token
    const lastDelim = Math.max(
      textBefore.lastIndexOf(' '), textBefore.lastIndexOf('\n'), textBefore.lastIndexOf('\t'),
      textBefore.lastIndexOf(','), textBefore.lastIndexOf('('), textBefore.lastIndexOf(')'),
      textBefore.lastIndexOf(';')
    );
    const token = textBefore.substring(lastDelim + 1).toLowerCase();
    // 至少 2 个字符才显示
    if (token.length < 2) { this._acClose(); return; }
    // 不匹配的全大写词（可能是已完成的 SQL 关键字）不触发
    if (/^[A-Z_]{3,}$/.test(textBefore.substring(lastDelim + 1))) { this._acClose(); return; }

    // Determine context
    // 1) 表名后跟 '.' → 列名补全
    const prevSpace = Math.max(
      textBefore.lastIndexOf(' ', lastDelim - 1),
      textBefore.lastIndexOf('\n', lastDelim - 1),
      textBefore.lastIndexOf('\t', lastDelim - 1)
    );
    const prevToken = textBefore.substring(prevSpace + 1, lastDelim).toLowerCase().replace(/[^a-z0-9_]/g, '');
    const dotMatch = textBefore.substring(prevSpace + 1, lastDelim).match(/^([a-zA-Z_][a-zA-Z0-9_]*)\.$/);
    if (dotMatch && this._acTableMeta[dotMatch[1]]) {
      const cols = this._acTableMeta[dotMatch[1]];
      this._acItems = cols
        .filter(c => c.toLowerCase().startsWith(token))
        .map(c => ({ label: c, desc: 'column' }));
    }
    // 2) 在 FROM/JOIN 之后 → 表名优先
    else if (prevToken === 'from' || prevToken === 'join' || prevToken.endsWith('join') || prevToken === 'into' || prevToken === 'update') {
      const tables = this._getTableNames();
      this._acItems = tables
        .filter(t => t.toLowerCase().startsWith(token))
        .map(t => ({ label: t, desc: 'table' }));
      // 也加入关键字
      const kw = this._sqlKeywords.filter(k => k.toLowerCase().startsWith(token)).map(k => ({ label: k, desc: 'keyword' }));
      this._acItems = [...kw.slice(0, 5), ...this._acItems];
    }
    // 3) 通用：关键字 + 表名
    else {
      const keyws = this._sqlKeywords
        .filter(k => k.toLowerCase().startsWith(token))
        .map(k => ({ label: k, desc: 'keyword' }));
      const tables = this._getTableNames()
        .filter(t => t.toLowerCase().startsWith(token))
        .map(t => ({ label: t, desc: 'table' }));
      this._acItems = [...keyws.slice(0, 12), ...tables.slice(0, 8)];
    }

    // 限制数量
    if (this._acItems.length > 20) this._acItems = this._acItems.slice(0, 20);

    if (this._acItems.length === 0) { this._acClose(); return; }

    this._acVisible = true;
    if (this._acIndex >= this._acItems.length) this._acIndex = 0;
    this._acToken = token;
    this._acRenderDropdown();

    // Position dropdown below cursor
    const dd = this._getAcDropdown();
    const lineH = 18; // approx line height
    const lines = textBefore.split('\n');
    const curLine = lines.length;
    const curCol = lines[lines.length - 1].length;
    const charW = 8.4; // monospace char width
    // Get editor absolute position
    const rect = editor.getBoundingClientRect();
    const scrollTop = editor.scrollTop;
    const scrollLeft = editor.scrollLeft;
    const paddingLeft = 12;
    const paddingTop = 12;
    dd.style.left = (rect.left + paddingLeft + curCol * charW) + 'px';
    dd.style.top = (rect.top + paddingTop + curLine * lineH - scrollTop) + 'px';
    dd.style.display = 'block';
  },

  _getTableNames() {
    const nodes = document.querySelectorAll('#tree-container .tree-label');
    const names = [];
    nodes.forEach(n => {
      const t = n.textContent.trim();
      if (t && !['表','视图','存储过程'].includes(t)) names.push(t);
    });
    return names;
  },

  expandSnippet(editor) {
    const pos = editor.selectionStart;
    const textBefore = editor.value.substring(0, pos);
    // Find the start of the word before cursor
    const lastSpace = Math.max(
      textBefore.lastIndexOf(' '),
      textBefore.lastIndexOf('\n'),
      textBefore.lastIndexOf('\t')
    );
    const abbr = textBefore.substring(lastSpace + 1, pos).toLowerCase();
    const snippet = this.snippets[abbr];
    if (!snippet) return null;

    // Get current connection dbType for dialect-aware expansion
    const conn = this.getActiveConn();
    const dbType = conn ? conn.dbType : 'mysql';

    // Resolve expansion
    let expanded = typeof snippet === 'function' ? snippet(dbType) : snippet;

    // Replace the abbreviation in the full text
    const before = editor.value.substring(0, lastSpace + 1);
    const after = editor.value.substring(pos);
    // If user typed a space/Tab to trigger, we consume that trigger char
    // (The default space/Tab insertion is prevented by the caller)
    this._captureUndoState();
    editor.value = before + expanded + after;

    // Place cursor at end of expanded text
    const newCursor = (lastSpace + 1) + expanded.length;
    this.checkDangerSQL();
    this._syncHighlight();
    this.log('message', '展开 snippet: ' + abbr + ' → ' + expanded, 'info');
    return { cursorPos: newCursor };
  },

  formatSQL() {
    const editor = document.getElementById('sql-editor');
    let sql = editor.value;
    if (!sql.trim()) return;
    const keywords = ['SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'ORDER BY', 'GROUP BY', 'HAVING', 'LIMIT', 'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM', 'CREATE TABLE', 'ALTER TABLE', 'ADD', 'DROP', 'INNER JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'ON'];
    keywords.forEach(kw => {
      const re = new RegExp('\\b' + kw.replace(' ', '\\s+') + '\\b', 'gi');
      sql = sql.replace(re, kw);
    });
    sql = sql.replace(/\s+(FROM|WHERE|ORDER BY|GROUP BY|HAVING|LIMIT|VALUES|SET|INNER JOIN|LEFT JOIN|RIGHT JOIN|ON)/gi, '\n$1');
    this._captureUndoState();
    editor.value = sql;
    this.checkDangerSQL();
    this._syncHighlight();
    this.log('message', 'SQL 已格式化', 'info');
  },

  clearEditor() {
    this._captureUndoState();
    document.getElementById('sql-editor').value = '';
    document.getElementById('sql-editor').classList.remove('danger-sql');
    document.getElementById('danger-banner').classList.remove('show');
    this.cachedResultHTML = null;
    this.lastResultData = null;
    document.getElementById('result-body').innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><div>暂无结果</div><div class="empty-hint">执行 SQL 查询或点击左侧表名查看数据</div></div>';
    document.getElementById('badge-results').textContent = '0';
    this._syncHighlight();
  },

  // ── Undo/Redo ──
  _captureUndoState() {
    clearTimeout(this._undoDebounce);
    const editor = document.getElementById('sql-editor');
    if (!editor) return;
    const state = { value: editor.value, start: editor.selectionStart, end: editor.selectionEnd };
    // 跳过与栈顶相同的连续状态
    if (this.undoStack.length > 0) {
      const last = this.undoStack[this.undoStack.length - 1];
      if (last.value === state.value && last.start === state.start && last.end === state.end) return;
    }
    this.undoStack.push(state);
    this.redoStack = [];
    if (this.undoStack.length > 100) this.undoStack.shift();
  },

  _pushUndoDebounced() {
    clearTimeout(this._undoDebounce);
    this._undoDebounce = setTimeout(() => this._captureUndoState(), 500);
  },

  undo() {
    const editor = document.getElementById('sql-editor');
    if (!editor || this.undoStack.length === 0) return;
    this.redoStack.push({ value: editor.value, start: editor.selectionStart, end: editor.selectionEnd });
    // 跳过与栈顶相同内容的状态，直接取上一个
    while (this.undoStack.length > 0) {
      const state = this.undoStack.pop();
      if (state.value !== editor.value) {
        editor.value = state.value;
        editor.selectionStart = state.start;
        editor.selectionEnd = state.end;
        break;
      }
    }
    this.checkDangerSQL();
    this._syncHighlight();
    this._updateCursorPos();
  },

  redo() {
    const editor = document.getElementById('sql-editor');
    if (!editor || this.redoStack.length === 0) return;
    this.undoStack.push({ value: editor.value, start: editor.selectionStart, end: editor.selectionEnd });
    while (this.redoStack.length > 0) {
      const state = this.redoStack.pop();
      if (state.value !== editor.value) {
        editor.value = state.value;
        editor.selectionStart = state.start;
        editor.selectionEnd = state.end;
        break;
      }
    }
    this.checkDangerSQL();
    this._syncHighlight();
    this._updateCursorPos();
  },

  _updateCursorPos() {
    const editor = document.getElementById('sql-editor');
    const pos = editor.selectionStart;
    const text = editor.value.substring(0, pos);
    const line = text.split('\n').length;
    const col = pos - text.lastIndexOf('\n');
    document.getElementById('editor-pos').textContent = `Ln ${line}, Col ${col}`;
  },

  // ── Tab Switching ──
  switchTab(tab) {
    const body = document.getElementById('result-body');
    // Cache current content before switching away from results
    if (this.activeTab === 'results' && tab !== 'results') {
      this.cachedResultHTML = body.innerHTML;
    }
    this.activeTab = tab;
    document.querySelectorAll('.result-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
    if (tab === 'results') {
      body.innerHTML = this.cachedResultHTML || '<div class="empty-state"><div class="empty-icon">📊</div><div>暂无结果</div><div class="empty-hint">执行 SQL 查询或点击左侧表名查看数据</div></div>';
    } else if (tab === 'structure') {
      this.renderStructureTab();
    } else if (tab === 'messages') {
      this.renderMessages();
    }
  },

  // ── Message Log ──
  log(type, message, level) {
    if (!this.messages) this.messages = [];
    const time = new Date().toLocaleTimeString('zh-CN', {hour12: false});
    this.messages.push({type, message, level: level || 'info', time});
    if (this.messages.length > 200) this.messages = this.messages.slice(-200);
    if (this.activeTab === 'messages') this.renderMessages();
    document.getElementById('editor-info').textContent = message;
  },

  renderMessages() {
    const body = document.getElementById('result-body');
    const msgs = this.messages || [];
    if (msgs.length === 0) {
      body.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div>暂无消息</div></div>';
      return;
    }
    let html = '<div class="message-log">';
    msgs.forEach(m => {
      html += `<div class="msg-${m.level}"><span class="msg-time">[${m.time}]</span>${m.message}</div>`;
    });
    html += '</div>';
    body.innerHTML = html;
    body.scrollTop = body.scrollHeight;
  },

  // ── Section Toggle ──
  toggleSection(id) {
    const section = document.getElementById(id);
    const header = section.querySelector('.section-header');
    header.classList.toggle('collapsed');
    section.classList.toggle('collapsed');
  },

  // ── Resizers (using pointer events + setPointerCapture for iframe compat) ──
  initResizers() {
    // Vertical resizer (left panel <-> center)
    this._initResizerV('resizer-left', 'left-panel', 'e.clientX', true);
    // Horizontal resizer (editor <-> results)
    this._initResizerH('resizer-h', 'editor-section', 'editorHeight');
  },

  _initResizerV(resizerId, panelId, clientAxis, isLeft) {
    const resizer = document.getElementById(resizerId);
    const panel = document.getElementById(panelId);
    let startX, startWidth;

    resizer.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resizer.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startWidth = panel.offsetWidth;
      resizer.classList.add('dragging');

      resizer.onpointermove = (e) => {
        const dx = e.clientX - startX;
        const newW = startWidth + dx;
        panel.style.width = Math.max(180, Math.min(420, newW)) + 'px';
      };

      resizer.onpointerup = () => {
        resizer.classList.remove('dragging');
        resizer.onpointermove = null;
        resizer.onpointerup = null;
      };
    });
  },

  _initResizerH(resizerId, editorSectionId, storageKey) {
    const resizer = document.getElementById(resizerId);
    const editorSection = document.getElementById(editorSectionId);
    const resultsSection = document.getElementById('results-section');
    let startY, startHeight;

    resizer.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resizer.setPointerCapture(e.pointerId);
      startY = e.clientY;
      startHeight = resultsSection.offsetHeight;
      resizer.classList.add('dragging');

      resizer.onpointermove = (e) => {
        const dy = startY - e.clientY;
        const newH = Math.max(120, startHeight + dy);
        const maxH = window.innerHeight - 150;
        resultsSection.style.height = Math.min(maxH, newH) + 'px';
        // Editor section gets the rest via flex
      };

      resizer.onpointerup = () => {
        resizer.classList.remove('dragging');
        resizer.onpointermove = null;
        resizer.onpointerup = null;
      };
    });
  },

  // ── Fullscreen ──
  initFullscreen() {
    document.addEventListener('fullscreenchange', () => this._onFullscreenChange());
    document.addEventListener('webkitfullscreenchange', () => this._onFullscreenChange());
  },

  toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  },

  _onFullscreenChange() {
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const btn = document.getElementById('fs-btn');
    if (isFS) {
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m13-5h-3a2 2 0 0 0-2 2v3"/></svg>';
      btn.title = '退出全屏 (Esc)';
      btn.classList.add('fullscreen-active');
    } else {
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>';
      btn.title = '全屏查看';
      btn.classList.remove('fullscreen-active');
    }
  },

  // ── Table Context Menu ──
  onTableContextMenu(e, dbName, tableName) {
    e.preventDefault();
    e.stopPropagation();
    this.contextTableDB = dbName;
    this.contextTableName = tableName;

    const menu = document.getElementById('table-context-menu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('show');

    const hideMenu = () => {
      menu.classList.remove('show');
      document.removeEventListener('click', hideMenu);
    };
    setTimeout(() => document.addEventListener('click', hideMenu), 0);
  },

  runTableQuery(limit) {
    const tableName = this.contextTableName;
    if (!tableName) return;
    const conn = this.getActiveConn();
    const editor = document.getElementById('sql-editor');
    const query = (conn && conn.dbType === 'mssql')
      ? `SELECT TOP ${limit} * FROM ${tableName}`
      : `SELECT * FROM ${tableName} LIMIT ${limit}`;
    // 追加到编辑器末尾，保留已有内容
    const sep = editor.value.trim() ? '\n\n' : '';
    this._captureUndoState();
    editor.value += sep + query + ';';
    // 滚动到末尾并聚焦
    editor.scrollTop = editor.scrollHeight;
    editor.focus();
    this.checkDangerSQL();
    this._syncHighlight();
    this.executeSQL();
  },

  genInsertSQL() {
    const tableName = this.contextTableName;
    if (!tableName) return;
    const editor = document.getElementById('sql-editor');
    const cols = this.structData || [];
    this._captureUndoState();
    if (cols.length === 0) {
      editor.value = `INSERT INTO ${tableName} (column1, column2) VALUES (value1, value2);`;
    } else {
      const colNames = cols.map(c => c.name).join(', ');
      const placeholders = cols.map(() => '?').join(', ');
      editor.value = `INSERT INTO ${tableName} (${colNames}) VALUES (${placeholders});`;
    }
    this.checkDangerSQL();
    this._syncHighlight();
    this.log('message', `已生成 INSERT 模板: ${tableName}`, 'info');
  },

  // ── Row Context Menu ──
  onRowContextMenu(e, rowEl) {
    e.preventDefault();
    e.stopPropagation();
    const rowIndex = parseInt(rowEl.dataset.rowIndex);
    if (isNaN(rowIndex)) return;

    // Store context for the menu action
    this.contextRowIndex = rowIndex;

    // Show context menu at cursor position
    const menu = document.getElementById('context-menu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('show');

    // Hide on click elsewhere
    const hideMenu = () => {
      menu.classList.remove('show');
      document.removeEventListener('click', hideMenu);
    };
    setTimeout(() => document.addEventListener('click', hideMenu), 0);
  },

  showRowDetail() {
    const data = this.lastResultData;
    if (!data || !data.columns || !data.rows || this.contextRowIndex === undefined) return;
    const row = data.rows[this.contextRowIndex];
    if (!row) return;

    let html = '<table class="row-detail-table"><tbody>';
    data.columns.forEach((col, i) => {
      const val = row[i];
      let display;
      if (val === null || val === undefined) {
        display = '<span class="null-val">NULL</span>';
      } else if (typeof val === 'number') {
        display = `<span class="num-val">${val}</span>`;
      } else {
        display = String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      html += `<tr><th>${col}</th><td>${display}</td></tr>`;
    });
    html += '</tbody></table>';

    document.getElementById('row-detail-body').innerHTML = html;
    document.getElementById('row-detail-modal').classList.add('show');
  },

  closeRowDetail() {
    document.getElementById('row-detail-modal').classList.remove('show');
    this.contextRowIndex = undefined;
  },

  // ── Loading ──
  showLoading(text) {
    document.getElementById('loading-text').textContent = text || '加载中...';
    document.getElementById('loading').style.display = 'flex';
  },
  hideLoading() {
    document.getElementById('loading').style.display = 'none';
  }
};

App.init();
</script>
