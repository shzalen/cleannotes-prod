<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>在线 DB 管理工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#1e293b;--text-2:#64748b;--text-3:#94a3b8;
  --primary:#2563eb;--primary-hover:#1d4ed8;--primary-light:#eff6ff;
  --success:#16a34a;--success-light:#f0fdf4;--danger:#dc2626;--danger-light:#fef2f2;
  --warning:#d97706;--warning-light:#fffbeb;
  --code-bg:#f6f8fa;--hover:#f1f5f9;--tree-hover:#e8f0fe;
}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
header .header-left{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
header h1{font-size:16px;font-weight:600;color:#0f172a;display:flex;align-items:center;gap:6px;white-space:nowrap}
header h1 .icon{font-size:18px}
header .conn-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
header .conn-status .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3)}
header .conn-status .dot.connected{background:var(--success)}
header .conn-status .dot.error{background:var(--danger)}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}
.toolbar-left{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid var(--border)}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #fecaca}

/* DB connection status in toolbar */
.db-status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);display:inline-block}
.db-status-dot.connected{background:var(--success)}
.db-status-text{font-size:12px;color:var(--text-2);font-weight:500}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=password]{
  padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;transition:border-color .15s;background:var(--surface);color:var(--text)
}
select:focus,input:focus{border-color:var(--primary)}
select{cursor:pointer}

/* ── Fullscreen button ── */
.fs-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--text-2);transition:all .15s;flex-shrink:0;margin-top:4px}
.fs-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.fs-btn svg{width:15px;height:15px}
.fs-btn.fullscreen-active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Main Layout ── */
.main-layout{flex:1;display:flex;min-height:0;overflow:hidden}

/* ── Left Panel ── */
.left-panel{width:260px;min-width:180px;max-width:420px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--surface)}
.panel-section{display:flex;flex-direction:column;overflow:hidden}
.panel-section:first-child{flex-shrink:0}
.panel-section:last-child{flex:1;min-height:0}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#f8fafc;border-bottom:1px solid var(--border);flex-shrink:0;cursor:pointer;user-select:none}
.section-header .title{font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:4px}
.section-header .title .chevron{transition:transform .2s;display:inline-block}
.section-header.collapsed .title .chevron{transform:rotate(-90deg)}
.section-header .actions{display:flex;gap:4px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:none;border-radius:5px;background:transparent;cursor:pointer;color:var(--text-3);transition:all .15s}
.icon-btn:hover{background:var(--hover);color:var(--primary)}
.icon-btn svg{width:14px;height:14px}

/* Connection list */
.conn-list{max-height:200px;overflow-y:auto;overflow-x:hidden;flex-shrink:0}
.panel-section.collapsed .conn-list{max-height:0;overflow:hidden}
.conn-list:empty::after{content:'暂无连接，点击 + 新增';display:block;padding:16px 12px;font-size:12px;color:var(--text-3);text-align:center}
.conn-item{display:flex;align-items:center;gap:6px;padding:6px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:background .1s;position:relative;min-height:32px}
.conn-item:hover{background:var(--hover)}
.conn-item.active{background:var(--primary-light)}
.conn-item .conn-name{flex:1;min-width:0;font-size:12px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn-item .conn-type{font-size:10px;color:#475569;padding:1px 5px;border-radius:4px;background:#f1f5f9;flex-shrink:0;font-weight:600}
.conn-item .conn-type.type-mysql{background:#e0f2fe;color:#0277bd}
.conn-item .conn-type.type-pgsql{background:#e8f5e9;color:#2e7d32}
.conn-item .conn-type.type-mssql{background:#ffebee;color:#c62828}
.conn-item .conn-actions{display:flex;gap:2px;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:inherit;padding:0 4px;visibility:hidden}
.conn-item:hover .conn-actions{visibility:visible}

/* Tree */
.tree-container{flex:1;overflow-y:auto;min-height:0}
.tree-container:empty::after{content:'请先连接数据库';display:block;padding:20px 12px;font-size:12px;color:var(--text-3);text-align:center}
.tree-node{padding:2px 0;user-select:none}
.tree-label{display:flex;align-items:center;gap:4px;padding:4px 12px;cursor:pointer;border-radius:4px;font-size:12px;transition:background .1s;white-space:nowrap}
.tree-label:hover{background:var(--tree-hover)}
.tree-label .tree-icon{width:14px;height:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.tree-label .tree-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-label.active{background:var(--primary-light);color:var(--primary);font-weight:500}
.tree-children{margin-left:16px;display:none}
.tree-children.expanded{display:block}
.tree-label .chevron{font-size:9px;color:var(--text-3);width:10px;flex-shrink:0;transition:transform .15s}
.tree-label.expanded .chevron{transform:rotate(90deg)}

/* Category nodes */
.category-node{margin:0 0 2px 0}
.cat-label{padding:5px 12px;font-weight:600;font-size:11px;color:var(--text-2);border-radius:4px}
.cat-label:hover{background:#f1f5f9}
.cat-label .cat-count{font-size:10px;color:var(--text-3);margin-left:auto;background:#f1f5f9;padding:1px 6px;border-radius:8px}
.cat-children{margin-left:8px}
.cat-children:empty::after{content:'无';display:block;padding:6px 20px;font-size:11px;color:var(--text-3);font-style:italic}

/* ── Resizer vertical (between left panel and center) ── */
.resizer{width:5px;cursor:col-resize;background:transparent;flex-shrink:0;position:relative;z-index:10;touch-action:none}
.resizer::after{content:'';position:absolute;inset:-3px 0}
.resizer:hover,.resizer.dragging{background:var(--primary)}

/* ── Center Area ── */
.center-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* ── SQL Editor Section (top half) ── */
.editor-section{flex:1;display:flex;flex-direction:column;background:var(--surface);min-height:120px}
.editor-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#f8fafc;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.editor-header .title{font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.editor-header .title .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.editor-header .actions{display:flex;align-items:center;gap:6px}
.editor-wrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.sql-editor{flex:1;width:100%;border:none;outline:none;resize:none;padding:12px 16px;font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:13px;line-height:1.7;color:var(--text);background:var(--surface);tab-size:2;transition:background .3s}
.sql-editor::placeholder{color:var(--text-3)}
.sql-editor.danger-sql{background:#fff5f5;box-shadow:inset 0 0 0 2px var(--danger)}

/* Danger banner */
.danger-banner{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--danger-light);border-top:1px solid #fecaca;color:var(--danger);font-size:12px;font-weight:500;flex-shrink:0}
.danger-banner.show{display:flex}
.danger-banner .danger-icon{font-size:14px}

.editor-footer{padding:4px 12px;background:#f8fafc;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);flex-shrink:0;display:flex;justify-content:space-between;align-items:center}

/* ── Resizer horizontal (between editor and results) ── */
.resizer-h{height:5px;cursor:row-resize;background:transparent;flex-shrink:0;position:relative;z-index:10;touch-action:none}
.resizer-h::after{content:'';position:absolute;inset:0 -3px}
.resizer-h:hover,.resizer-h.dragging{background:var(--primary)}

/* ── Results Section (bottom) ── */
.results-section{height:40%;min-height:150px;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
.result-tabs{display:flex;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;background:#f8fafc}
.result-tab{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--text-2);transition:all .15s;border-bottom:2px solid transparent}
.result-tab:hover{color:var(--text)}
.result-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.result-tab .badge{display:inline-block;margin-left:4px;padding:0 5px;background:var(--border);border-radius:8px;font-size:10px;color:var(--text-2)}
.result-tab.active .badge{background:var(--primary-light);color:var(--primary)}
.result-body{flex:1;overflow:auto;min-height:0;padding:0}

/* Result table */
.result-table{width:100%;border-collapse:collapse;font-size:12px}
.result-table thead{position:sticky;top:0;z-index:1}
.result-table th{padding:7px 10px;text-align:left;font-weight:600;color:var(--text);background:#f1f5f9;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
.result-table th:hover{background:#e2e8f0}
.result-table th .th-type{font-size:10px;font-weight:400;color:var(--text-3);margin-left:4px}
.result-table td{padding:5px 10px;border-bottom:1px solid #f1f5f9;color:var(--text);max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-table td:hover{white-space:normal}
.result-table tr:hover td{background:var(--hover)}
.result-table .null-val{color:var(--text-3);font-style:italic}
.result-table .num-val{color:#0550ae;font-family:monospace}
.result-table .pk-val{background:var(--warning-light);font-weight:600}

/* Table search */
.tree-search{padding:4px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.tree-search input{width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;outline:none;background:var(--bg);color:var(--text)}
.tree-search input:focus{border-color:var(--primary);background:var(--surface)}

/* Result row number */
.result-table .col-num{width:36px;min-width:36px;color:var(--text-3);font-size:11px;text-align:center;user-select:none}
.result-table td.col-num{background:#f8fafc}

/* Context menu */
.context-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:2000;min-width:150px;padding:4px;display:none;user-select:none}
.context-menu.show{display:block}
.context-menu-item{padding:7px 12px;font-size:12px;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:6px;color:var(--text);transition:background .1s}
.context-menu-item:hover{background:var(--hover);color:var(--primary)}
.context-menu-sep{height:1px;background:var(--border);margin:3px 6px}

/* Row detail modal */
.row-detail-table{width:100%;border-collapse:collapse;font-size:12px}
.row-detail-table th{text-align:right;padding:6px 10px;font-weight:600;color:var(--text-2);background:#f8fafc;border-bottom:1px solid var(--border);white-space:nowrap;width:35%}
.row-detail-table td{padding:6px 10px;border-bottom:1px solid #f1f5f9;color:var(--text);word-break:break-all;font-family:"Cascadia Code","Fira Code",Consolas,monospace}
.row-detail-table .null-val{color:var(--text-3);font-style:italic}

/* Header port config */
.port-config-inline{display:flex;align-items:center;gap:6px}
.port-config-inline .port-label{font-size:11px;color:var(--text-3);font-weight:500}
.port-config-inline input{width:64px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:"Cascadia Code",Consolas,monospace;text-align:center;outline:none;background:var(--surface);color:var(--text)}
.port-config-inline input:focus{border-color:var(--primary)}

/* Structure table */
.struct-table{width:100%;border-collapse:collapse;font-size:12px}
.struct-table th{padding:7px 10px;text-align:left;font-weight:600;color:var(--text);background:#f1f5f9;border-bottom:1px solid var(--border);white-space:nowrap}
.struct-table td{padding:5px 10px;border-bottom:1px solid #f1f5f9}
.struct-table .badge-pk{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--warning-light);color:var(--warning);font-size:10px;font-weight:600}
.struct-table .badge-ai{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--primary-light);color:var(--primary);font-size:10px;font-weight:600}

/* Messages */
.message-log{padding:12px 16px;font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:12px;line-height:1.8}
.message-log .msg-info{color:var(--text-2)}
.message-log .msg-success{color:var(--success)}
.message-log .msg-error{color:var(--danger)}
.message-log .msg-warn{color:var(--warning)}
.message-log .msg-time{color:var(--text-3);margin-right:8px}

/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-3);font-size:13px;gap:8px;padding:20px}
.empty-state .empty-icon{font-size:36px;opacity:.4}
.empty-state .empty-hint{font-size:11px;max-width:240px;text-align:center;line-height:1.5}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border-radius:12px;padding:0;width:460px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15);transform:scale(.95);transition:transform .2s}
.modal-overlay.show .modal{transform:scale(1)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h2{font-size:15px;font-weight:600;color:var(--text)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:12px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;font-weight:500;color:var(--text-2)}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.form-group .hint{font-size:11px;color:var(--text-3)}

/* ── Danger confirm modal ── */
.danger-modal .modal{border:2px solid var(--danger)}
.danger-modal .modal-header{background:var(--danger-light);border-bottom-color:#fecaca}
.danger-modal .modal-header h2{color:var(--danger)}
.danger-modal .modal-body .danger-hint{padding:8px 12px;background:#fff5f5;border:1px solid #fecaca;border-radius:6px;font-size:12px;color:var(--danger);line-height:1.5}
.danger-modal .modal-body .danger-code{font-family:monospace;font-size:11px;background:#fff1f0;padding:8px;border-radius:4px;margin-top:4px;max-height:120px;overflow:auto;color:var(--danger);white-space:pre-wrap;word-break:break-all}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ── Loading ── */
.loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:100;font-size:13px;color:var(--primary);gap:8px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1><span class="icon">🗄️</span> 在线 DB 管理工具</h1>
    <div class="conn-status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">未连接</span>
    </div>
  </div>
  <div class="header-right" style="display:flex;align-items:center;gap:8px;">
    <div class="port-config-inline">
      <span class="port-label">端口</span>
      <input type="number" id="header-port" min="1024" max="65535" value="3579" title="修改后按 Enter 切换端口" />
    </div>
    <button class="fs-btn" id="fs-btn" onclick="App.toggleFullscreen()" title="全屏查看">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
    </button>
  </div>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-left">
    <select id="conn-select" onchange="App.onConnectionSelect()" style="min-width:180px">
      <option value="">— 选择连接 —</option>
    </select>
    <button class="btn btn-sm btn-primary" onclick="App.connectToDB()" id="btn-connect">连接</button>
    <button class="btn btn-sm btn-secondary" onclick="App.disconnect()" id="btn-disconnect" disabled>断开</button>
    <button class="btn btn-sm btn-secondary" onclick="App.openConnModal()">+ 新增连接</button>
    <button class="btn btn-sm btn-secondary" onclick="App.refreshTree()" id="btn-refresh" disabled>刷新</button>
  </div>
  <div class="toolbar-right">
    <span class="db-status-dot" id="db-status-dot"></span>
    <span class="db-status-text" id="db-status-text">未连接</span>
  </div>
</div>

<!-- Main Layout -->
<div class="main-layout">

  <!-- Left Panel -->
  <div class="left-panel" id="left-panel">
    <!-- Connections section -->
    <div class="panel-section" id="conn-section">
      <div class="section-header" onclick="App.toggleSection('conn-section')">
        <span class="title"><span class="chevron">▼</span> 连接管理</span>
        <div class="actions">
          <button class="icon-btn" onclick="event.stopPropagation();App.openConnModal()" title="新增连接">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
      <div class="conn-list" id="conn-list"></div>
    </div>
    <!-- Tree section -->
    <div class="panel-section" style="flex:1">
      <div class="section-header">
        <span class="title"><span class="chevron">▼</span> 数据库浏览</span>
      </div>
      <div class="tree-search">
        <input type="text" id="table-search" placeholder="搜索表名..." oninput="App.filterTables()" />
      </div>
      <div class="tree-container" id="tree-container"></div>
    </div>
  </div>

  <!-- Vertical Resizer -->
  <div class="resizer" id="resizer-left"></div>

  <!-- Center Area: SQL Editor + Results (vertical stack) -->
  <div class="center-area" id="center-area">

    <!-- SQL Editor Section -->
    <div class="editor-section" id="editor-section">
      <div class="editor-header">
        <span class="title"><span class="dot"></span> SQL 编辑器</span>
        <div class="actions">
          <button class="btn btn-sm btn-primary" onclick="App.executeSQL()" id="btn-execute">▶ 执行 (Ctrl+Enter)</button>
          <button class="btn btn-sm btn-secondary" onclick="App.formatSQL()">格式化</button>
          <button class="btn btn-sm btn-secondary" onclick="App.clearEditor()">清空</button>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea class="sql-editor" id="sql-editor" placeholder="-- 输入 SQL 语句，按 Ctrl+Enter 执行&#10;-- 选中部分文本可仅执行选中部分&#10;-- 快捷输入: ssf(Tab) → SELECT * FROM ..., sf, sc, sw, ii, iu, df, ct, cj, lj, ob...&#10;SELECT * FROM table_name LIMIT 10;" spellcheck="false"></textarea>
        <div class="danger-banner" id="danger-banner">
          <span class="danger-icon">⚠️</span>
          <span id="danger-msg"></span>
        </div>
        <div class="editor-footer">
          <span id="editor-info">就绪</span>
          <span id="editor-pos">Ln 1, Col 1</span>
        </div>
      </div>
    </div>

    <!-- Horizontal Resizer -->
    <div class="resizer-h" id="resizer-h"></div>

    <!-- Results Section -->
    <div class="results-section" id="results-section">
      <div class="result-tabs">
        <button class="result-tab active" data-tab="results" onclick="App.switchTab('results')">结果 <span class="badge" id="badge-results">0</span></button>
        <button class="result-tab" data-tab="structure" onclick="App.switchTab('structure')">表结构</button>
        <button class="result-tab" data-tab="messages" onclick="App.switchTab('messages')">消息</button>
      </div>
      <div class="result-body" id="result-body">
        <div class="empty-state">
          <div class="empty-icon">📊</div>
          <div>暂无结果</div>
          <div class="empty-hint">执行 SQL 查询或点击左侧表名查看数据</div>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- Connection Modal -->
<div class="modal-overlay" id="conn-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">新增连接</h2>
      <button class="icon-btn" onclick="App.closeConnModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>连接名称</label>
        <input type="text" id="f-name" placeholder="例如：生产库 MySQL" />
      </div>
      <div class="form-group">
        <label>数据库类型</label>
        <select id="f-type" onchange="App.onTypeChange()">
          <option value="mysql">MySQL</option>
          <option value="pgsql">PostgreSQL</option>
          <option value="mssql">SQL Server</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group" style="flex:2">
          <label>主机地址</label>
          <input type="text" id="f-host" placeholder="localhost 或远程 IP" value="localhost" />
        </div>
        <div class="form-group" style="flex:1">
          <label>端口</label>
          <input type="number" id="f-port" value="3306" />

      <div class="form-row">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="f-user" placeholder="root" />
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="f-pass" placeholder="••••••" />
        </div>
      </div>
      <div class="form-group">
        <label>默认数据库</label>
        <input type="text" id="f-db" placeholder="可选，连接后可在树中切换" />
        <span class="hint">留空则连接后显示所有数据库列表</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="App.closeConnModal()">取消</button>
      <button class="btn btn-primary" onclick="App.saveConnection()">保存</button>

<div class="modal-overlay danger-modal" id="danger-modal">

      <button class="btn btn-secondary" onclick="App.closeDangerModal()">取消</button>
      <button class="btn btn-danger" onclick="App.confirmDangerSQL()" id="btn-danger-confirm">确认执行</button>
    </div>

<div class="modal-overlay" id="row-detail-modal">

    <span>🔍</span> 查询前 1000
  </div>

    <span>➕</span> 生成 INSERT 语句

  <div class="context-menu-item" onclick="App.showRowDetail()">
    <span>📋</span> 查看数据详情
  </div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading" style="display:none">
  <div class="spinner"></div>
  <span id="loading-text">加载中...</span>
</div>

<script>
const App = {
  // ── State ──
  port: 3579,
  baseUrl: '',
  connections: [],
  activeConnId: null,
  currentDB: '',
  connected: false,
  editingId: null,
  activeTab: 'results',
  currentTable: '',
  pendingDangerSQL: null,
  cachedResultHTML: null,
  lastResultData: null,
  contextRowIndex: undefined,

  // ── Snippets ──
  snippets: {
    ssf:  (t) => t === 'mssql' ? 'SELECT TOP 100 * FROM ' : 'SELECT * FROM ',
    sf:   (t) => 'SELECT * FROM ',
    sc:   (t) => 'SELECT COUNT(*) FROM ',
    si:   (t) => 'SELECT * FROM [cursor] WHERE [column] = [value]',
    su:   (t) => 'SELECT DISTINCT ',
    sw:   (t) => 'SELECT * FROM [cursor] WHERE ',
    s100: (t) => t === 'mssql' ? 'SELECT TOP 100 * FROM ' : 'SELECT * FROM ',
    sto:  (t) => t === 'mssql' ? 'SELECT TOP 100 * FROM ' : 'SELECT * FROM ',
    ii:   (t) => 'INSERT INTO [cursor] ([columns]) VALUES ([values])',
    iu:   (t) => 'UPDATE [cursor] SET [column] = [value] WHERE ',
    df:   (t) => 'DELETE FROM [cursor] WHERE ',
    ct:   (t) => 'CREATE TABLE [cursor] (\n  [id] INT PRIMARY KEY,\n  [column] VARCHAR(255)\n)',
    al:   (t) => 'ALTER TABLE [cursor] ADD [column] VARCHAR(255)',
    dt:   (t) => 'DROP TABLE [cursor]',
    cj:   (t) => 'INNER JOIN [cursor] ON [a].[id] = [b].[id]',
    lj:   (t) => 'LEFT JOIN [cursor] ON [a].[id] = [b].[id]',
    gb:   (t) => 'GROUP BY ',
    ob:   (t) => 'ORDER BY ',
    obd:  (t) => 'ORDER BY [cursor] DESC',
    lm:   (t) => t === 'mssql' ? 'SELECT TOP 10 * FROM ' : 'SELECT * FROM [cursor] LIMIT 10',
    ex:   (t) => 'EXEC sp_helptext ',
    all:  (t) => 'SELECT * FROM ',
  },

  // ── Init ──
  init() {
    const params = new URLSearchParams(location.search);
    this.port = parseInt(params.get('port')) || 3579;
    this.baseUrl = `http://localhost:${this.port}`;

    // Set header port input and handle port switch
    const portInput = document.getElementById('header-port');
    portInput.value = this.port;
    portInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const newPort = parseInt(portInput.value);
        if (newPort > 1024 && newPort < 65536 && newPort !== this.port) {
          window.location.href = `http://localhost:${newPort}/?port=${newPort}`;
        }
      }
    });

    this.connections = JSON.parse(localStorage.getItem('db-manager-conns') || '[]');
    this.renderConnList();
    this.renderConnSelect();
    this.initEditor();
    this.initResizers();
    this.initFullscreen();

    const lastId = localStorage.getItem('db-manager-last');
    if (lastId) {
      this.activeConnId = lastId;
      document.getElementById('conn-select').value = lastId;
    }
    this.checkServer();
  },

  // ── Server Health ──
  async checkServer() {
    try {
      const res = await fetch(`${this.baseUrl}/api/health`);
      if (res.ok) {
        this.setServerOnline(true);
        this.log('message', `API 服务已就绪 (${this.baseUrl})`, 'success');
      } else {
        this.setServerOnline(false);
      }
    } catch(e) {
      this.setServerOnline(false);
      this.log('message', `无法连接到 API 服务 (${this.baseUrl})，请确认 db-manager.exe 已启动`, 'error');
    }
  },

  // ── API Helper ──
  async api(endpoint, body) {
    const res = await fetch(`${this.baseUrl}${endpoint}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok && !data.error) throw new Error(`HTTP ${res.status}`);
    return data;
  },

  // ── Connection Management ──
  getActiveConn() {
    return this.connections.find(c => c.id === this.activeConnId);
  },

  onConnectionSelect() {
    this.activeConnId = document.getElementById('conn-select').value;
    if (this.activeConnId) {
      localStorage.setItem('db-manager-last', this.activeConnId);
    }
    this.renderConnList();
    this.disconnect();
  },

  openConnModal(id) {
    this.editingId = id || null;
    const modal = document.getElementById('conn-modal');
    document.getElementById('modal-title').textContent = id ? '编辑连接' : '新增连接';
    if (id) {
      const conn = this.connections.find(c => c.id === id);
      if (conn) {
        document.getElementById('f-name').value = conn.name;
        document.getElementById('f-type').value = conn.dbType;
        document.getElementById('f-host').value = conn.host;
        document.getElementById('f-port').value = conn.port;
        document.getElementById('f-user').value = conn.user;
        document.getElementById('f-pass').value = conn.password || '';
        document.getElementById('f-db').value = conn.database || '';
      }
    } else {
      document.getElementById('f-name').value = '';
      document.getElementById('f-type').value = 'mysql';
      document.getElementById('f-host').value = 'localhost';
      document.getElementById('f-port').value = '3306';
      document.getElementById('f-user').value = '';
      document.getElementById('f-pass').value = '';
      document.getElementById('f-db').value = '';
    }
    this.onTypeChange();
    modal.classList.add('show');
  },

  closeConnModal() {
    document.getElementById('conn-modal').classList.remove('show');
    this.editingId = null;
  },

  onTypeChange() {
    const type = document.getElementById('f-type').value;
    const portMap = {mysql: 3306, pgsql: 5432, mssql: 1433};
    document.getElementById('f-port').value = portMap[type] || 3306;
  },

  saveConnection() {
    const conn = {
      id: this.editingId || ('conn_' + Date.now()),
      name: document.getElementById('f-name').value.trim() || '未命名连接',
      dbType: document.getElementById('f-type').value,
      host: document.getElementById('f-host').value.trim() || 'localhost',
      port: parseInt(document.getElementById('f-port').value) || 3306,
      user: document.getElementById('f-user').value.trim(),
      password: document.getElementById('f-pass').value,
      database: document.getElementById('f-db').value.trim()
    };
    if (this.editingId) {
      const idx = this.connections.findIndex(c => c.id === this.editingId);
      if (idx >= 0) this.connections[idx] = conn;
    } else {
      this.connections.push(conn);
    }
    localStorage.setItem('db-manager-conns', JSON.stringify(this.connections));
    this.renderConnList();
    this.renderConnSelect();
    this.closeConnModal();
    if (!this.editingId) {
      this.activeConnId = conn.id;
      localStorage.setItem('db-manager-last', conn.id);
      document.getElementById('conn-select').value = conn.id;
      this.renderConnList();
    }
    this.log('message', `连接 "${conn.name}" 已保存`, 'success');
  },

  deleteConnection(id) {
    const conn = this.connections.find(c => c.id === id);
    if (!confirm(`确定删除连接 "${conn?.name || ''}" 吗？`)) return;
    this.connections = this.connections.filter(c => c.id !== id);
    localStorage.setItem('db-manager-conns', JSON.stringify(this.connections));
    if (this.activeConnId === id) {
      this.activeConnId = null;
      this.disconnect();
    }
    this.renderConnList();
    this.renderConnSelect();
    this.log('message', `连接已删除`, 'info');
  },

  renderConnList() {
    const list = document.getElementById('conn-list');
    list.innerHTML = '';
    this.connections.forEach(conn => {
      const item = document.createElement('div');
      item.className = 'conn-item' + (conn.id === this.activeConnId ? ' active' : '');
      item.innerHTML = `
        <span class="conn-type type-${conn.dbType}">${conn.dbType}</span>
        <span class="conn-name" title="${conn.host}:${conn.port}">${conn.name}</span>
        <div class="conn-actions">
          <button class="icon-btn" onclick="event.stopPropagation();App.openConnModal('${conn.id}')" title="编辑">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn" onclick="event.stopPropagation();App.deleteConnection('${conn.id}')" title="删除">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      `;
      item.onclick = () => {
        this.activeConnId = conn.id;
        localStorage.setItem('db-manager-last', conn.id);
        document.getElementById('conn-select').value = conn.id;
        this.renderConnList();
      };
      list.appendChild(item);
    });
  },

  renderConnSelect() {
    const sel = document.getElementById('conn-select');
    const current = sel.value;
    sel.innerHTML = '<option value="">— 选择连接 —</option>';
    this.connections.forEach(conn => {
      const opt = document.createElement('option');
      opt.value = conn.id;
      opt.textContent = `${conn.name} (${conn.dbType})`;
      sel.appendChild(opt);
    });
    sel.value = current;
  },

  // ── Connection Operations ──
  async connectToDB() {
    const conn = this.getActiveConn();
    if (!conn) { alert('请先选择一个连接'); return; }
    this.showLoading('正在连接...');
    try {
      const data = await this.api('/api/connect', {
        dbType: conn.dbType,
        host: conn.host,
        port: conn.port,
        user: conn.user,
        password: conn.password,
        database: conn.database || (conn.dbType === 'mysql' ? 'mysql' : conn.dbType === 'pgsql' ? 'postgres' : 'master')
      });
      if (data.ok) {
        this.setConnected(true);
        this.log('message', `连接成功: ${conn.name} (${conn.host}:${conn.port})`, 'success');
        await this.loadDatabases();
      } else {
        this.setConnected(false);
        this.log('message', `连接失败: ${data.error}`, 'error');
      }
    } catch(e) {
      this.setConnected(false);
      this.log('message', `请求失败: ${e.message}`, 'error');
    }
    this.hideLoading();
  },

  setConnected(connected) {
    this.connected = connected;
    const dot = document.getElementById('db-status-dot');
    const text = document.getElementById('db-status-text');
    const btnDisc = document.getElementById('btn-disconnect');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnExec = document.getElementById('btn-execute');
    if (connected) {
      dot.className = 'db-status-dot connected';
      text.textContent = '已连接';
      btnDisc.disabled = false;
      btnRefresh.disabled = false;
      btnExec.disabled = false;
    } else {
      dot.className = 'db-status-dot';
      text.textContent = '未连接';
      btnDisc.disabled = true;
      btnRefresh.disabled = true;
      btnExec.disabled = true;
    }
  },

  setServerOnline(online) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (online) {
      dot.className = 'dot connected';
      text.textContent = '在线中';
    } else {
      dot.className = 'dot';
      text.textContent = '未连接';
    }
  },

  disconnect() {
    this.setConnected(false);
    this.currentDB = '';
    document.getElementById('tree-container').innerHTML = '';
    this.log('message', '已断开连接', 'info');
  },

  async refreshTree() {
    if (this.connected) await this.loadDatabases();
  },

  // ── Database Tree ──
  async loadDatabases() {
    const conn = this.getActiveConn();
    if (!conn) return;
    this.showLoading('加载数据库列表...');
    try {
      const data = await this.api('/api/databases', {
        dbType: conn.dbType,
        host: conn.host,
        port: conn.port,
        user: conn.user,
        password: conn.password,
        database: conn.database || ''
      });
      if (data.error) {
        this.log('message', `加载失败: ${data.error}`, 'error');
        this.hideLoading(); return;
      }
      this.renderTree(data.databases || []);
      this.log('message', `加载 ${data.databases?.length || 0} 个数据库`, 'success');
    } catch(e) {
      this.log('message', `请求失败: ${e.message}`, 'error');
    }
    this.hideLoading();
  },

  renderTree(databases) {
    const container = document.getElementById('tree-container');
    container.innerHTML = '';
    databases.forEach(db => {
      const node = document.createElement('div');
      node.className = 'tree-node';
      node.innerHTML = `
        <div class="tree-label" onclick="App.toggleDB(this, '${db}')">
          <span class="chevron">▶</span>
          <span class="tree-icon">🗄️</span>
          <span class="tree-text">${db}</span>
        </div>
        <div class="tree-children"></div>
      `;
      container.appendChild(node);
    });
  },

  async toggleDB(labelEl, dbName) {
    const children = labelEl.nextElementSibling;
    const isExpanded = children.classList.contains('expanded');
    if (isExpanded) {
      children.classList.remove('expanded');
      labelEl.classList.remove('expanded');
      return;
    }
    // Close other databases
    document.querySelectorAll('.tree-children.expanded').forEach(el => {
      el.classList.remove('expanded');
      el.previousElementSibling?.classList.remove('expanded');
    });
    labelEl.classList.add('expanded');
    children.classList.add('expanded');
    this.currentDB = dbName;

    // Build 3 category groups with loading placeholders
    children.innerHTML = `
      <div class="tree-node category-node" data-cat="tables">
        <div class="tree-label cat-label" onclick="App.toggleCategory(this,'tables')">
          <span class="chevron">▼</span>
          <span class="tree-icon">📋</span>
          <span class="tree-text">表</span>
          <span class="cat-count" id="cat-count-tables">…</span>
        </div>
        <div class="tree-children expanded cat-children" id="cat-children-tables">
          <div style="padding:6px 20px;font-size:11px;color:var(--text-3)">加载中...</div>
        </div>
      </div>
      <div class="tree-node category-node" data-cat="views">
        <div class="tree-label cat-label" onclick="App.toggleCategory(this,'views')">
          <span class="chevron">▼</span>
          <span class="tree-icon">👁</span>
          <span class="tree-text">视图</span>
          <span class="cat-count" id="cat-count-views">…</span>
        </div>
        <div class="tree-children expanded cat-children" id="cat-children-views">
          <div style="padding:6px 20px;font-size:11px;color:var(--text-3)">加载中...</div>
        </div>
      </div>
      <div class="tree-node category-node" data-cat="procedures">
        <div class="tree-label cat-label" onclick="App.toggleCategory(this,'procedures')">
          <span class="chevron">▼</span>
          <span class="tree-icon">📦</span>
          <span class="tree-text">存储过程</span>
          <span class="cat-count" id="cat-count-procedures">…</span>
        </div>
        <div class="tree-children expanded cat-children" id="cat-children-procedures">
          <div style="padding:6px 20px;font-size:11px;color:var(--text-3)">加载中...</div>
        </div>
      </div>`;

    const conn = this.getActiveConn();
    if (!conn) return;

    try {
      const [tablesData, procData] = await Promise.all([
        this.api('/api/tables', {
          dbType: conn.dbType, host: conn.host, port: conn.port,
          user: conn.user, password: conn.password, database: dbName
        }),
        this.api('/api/procedures', {
          dbType: conn.dbType, host: conn.host, port: conn.port,
          user: conn.user, password: conn.password, database: dbName
        })
      ]);

      const allTables = tablesData.tables || [];
      const tableList = allTables.filter(t => t.type !== 'view');
      const viewList = allTables.filter(t => t.type === 'view');
      const procList = (procData.procedures || []).map(n => ({ name: n, type: 'procedure' }));

      this._renderCategoryItems('tables', tableList);
      this._renderCategoryItems('views', viewList);
      this._renderCategoryItems('procedures', procList);
    } catch(e) {
      ['tables','views','procedures'].forEach(cat => {
        const el = document.getElementById('cat-children-' + cat);
        if (el) el.innerHTML = `<div style="padding:8px 20px;font-size:11px;color:var(--danger)">${e.message}</div>`;
      });
    }
  },

  toggleCategory(labelEl, cat) {
    const children = labelEl.nextElementSibling;
    children.classList.toggle('expanded');
    labelEl.classList.toggle('expanded');
  },

  _renderCategoryItems(cat, items) {
    const container = document.getElementById('cat-children-' + cat);
    const countEl = document.getElementById('cat-count-' + cat);
    if (!container || !countEl) return;
    countEl.textContent = items.length;
    container.innerHTML = '';
    if (items.length === 0) return; // CSS :empty::after shows placeholder

    items.forEach(item => {
      const node = document.createElement('div');
      node.className = 'tree-node';
      let icon, clickHandler, ctxHandler;
      if (cat === 'procedures') {
        icon = '📄';
        clickHandler = `App.selectProcedure('${this.currentDB}', '${item.name.replace(/'/g, "\\'")}')`;
        ctxHandler = '';
      } else {
        icon = cat === 'views' ? '👁' : '📋';
        clickHandler = `App.selectTable(this, '${this.currentDB}', '${item.name.replace(/'/g, "\\'")}')`;
        ctxHandler = `oncontextmenu="App.onTableContextMenu(event, '${this.currentDB}', '${item.name.replace(/'/g, "\\'")}')"`;
      }
      node.innerHTML = `
        <div class="tree-label" onclick="${clickHandler}" ${ctxHandler}>
          <span style="width:14px"></span>
          <span class="tree-icon">${icon}</span>
          <span class="tree-text" title="${item.name}">${item.name}</span>
        </div>
      `;
      container.appendChild(node);
    });
  },

  async selectProcedure(dbName, procName) {
    document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
    // Find and highlight the procedure node
    const procNodes = document.querySelectorAll('#cat-children-procedures .tree-label');
    procNodes.forEach(n => {
      const txt = n.querySelector('.tree-text');
      if (txt && txt.textContent === procName) n.classList.add('active');
    });
    this.currentTable = procName;
    this.currentDB = dbName;

    const conn = this.getActiveConn();
    if (!conn) return;
    this.showLoading('加载存储过程...');
    try {
      const data = await this.api('/api/procedure-source', {
        dbType: conn.dbType, host: conn.host, port: conn.port,
        user: conn.user, password: conn.password, database: dbName,
        table: procName
      });
      if (data.error) {
        this.renderError(data.error);
      } else {
        const editor = document.getElementById('sql-editor');
        editor.value = data.source || `-- 无法获取 ${procName} 的源代码`;
        this.checkDangerSQL();
        this.switchTab('messages');
        this.log('message', `已加载存储过程: ${procName}`, 'success');
      }
    } catch(e) {
      this.renderError(e.message);
    }
    this.hideLoading();
  },

  filterTables() {
    const query = (document.getElementById('table-search')?.value || '').toLowerCase();
    const containers = document.querySelectorAll('.cat-children.expanded');
    containers.forEach(container => {
      const nodes = container.querySelectorAll('.tree-node');
      nodes.forEach(node => {
        const label = node.querySelector('.tree-label .tree-text');
        if (!label) return;
        const name = (label.textContent || '').toLowerCase();
        node.style.display = (!query || name.includes(query)) ? '' : 'none';
      });
    });
  },

  async selectTable(labelEl, dbName, tableName) {
    document.querySelectorAll('.tree-label.active').forEach(el => el.classList.remove('active'));
    labelEl.classList.add('active');
    this.currentTable = tableName;
    this.currentDB = dbName;
    await this.loadStructure(dbName, tableName);
    this.switchTab('structure');
  },

  // ── Load Table Structure ──
  async loadStructure(dbName, tableName) {
    const conn = this.getActiveConn();
    if (!conn) return;
    try {
      const data = await this.api('/api/columns', {
        dbType: conn.dbType,
        host: conn.host,
        port: conn.port,
        user: conn.user,
        password: conn.password,
        database: dbName,
        table: tableName
      });
      if (data.error) { this.renderStructure([]); return; }
      this.renderStructure(data.columns || []);
    } catch(e) { this.renderStructure([]); }
  },

  renderStructure(columns) {
    this.structData = columns;
    if (this.activeTab === 'structure') this.renderStructureTab();
  },

  renderStructureTab() {
    const body = document.getElementById('result-body');
    const columns = this.structData || [];
    if (columns.length === 0) {
      body.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div>暂无表结构数据</div><div class="empty-hint">点击左侧表名查看结构</div></div>';
      return;
    }
    let html = '<table class="struct-table"><thead><tr>';
    html += '<th>列名</th><th>类型</th><th>可空</th><th>默认值</th><th>主键</th><th>自增</th><th>注释</th>';
    html += '</tr></thead><tbody>';
    columns.forEach(col => {
      html += '<tr>';
      html += `<td><strong>${col.name}</strong></td>`;
      html += `<td>${col.type}</td>`;
      html += `<td>${col.nullable === 'YES' || col.nullable === 'YES' ? '<span style="color:var(--success)">YES</span>' : '<span style="color:var(--text-3)">NO</span>'}</td>`;
      html += `<td style="color:var(--text-3)">${col.default || '—'}</td>`;
      html += `<td>${col.is_pk ? '<span class="badge-pk">PK</span>' : ''}</td>`;
      html += `<td>${col.auto_inc ? '<span class="badge-ai">AI</span>' : ''}</td>`;
      html += `<td style="color:var(--text-3);font-size:11px">${col.comment || ''}</td>`;
      html += '</tr>';
    });
    html += '</tbody></table>';
    body.innerHTML = html;
  },

  // ── Danger SQL Detection ──
  getDangerLevel(sql) {
    const upper = sql.toUpperCase();
    // DROP / TRUNCATE / ALTER — always dangerous
    if (/\bDROP\b/.test(upper)) return { level: 'high', type: 'DROP' };
    if (/\bTRUNCATE\b/.test(upper)) return { level: 'high', type: 'TRUNCATE' };
    if (/\bALTER\b/.test(upper)) return { level: 'high', type: 'ALTER' };
    // UPDATE / DELETE — dangerous only without WHERE
    if (/\bDELETE\b/.test(upper)) {
      if (!/\bWHERE\b/.test(upper)) return { level: 'high', type: 'DELETE (无 WHERE)' };
      return { level: 'medium', type: 'DELETE' };
    }
    if (/\bUPDATE\b/.test(upper)) {
      if (!/\bWHERE\b/.test(upper)) return { level: 'high', type: 'UPDATE (无 WHERE)' };
      return { level: 'medium', type: 'UPDATE' };
    }
    return null;
  },

  checkDangerSQL() {
    const editor = document.getElementById('sql-editor');
    const sql = this.getSQLToExecute();
    const danger = this.getDangerLevel(sql);
    const banner = document.getElementById('danger-banner');
    const msgEl = document.getElementById('danger-msg');

    if (danger) {
      editor.classList.add('danger-sql');
      banner.classList.add('show');
      if (danger.level === 'high') {
        msgEl.textContent = `⚠️ 检测到危险操作: ${danger.type} — 执行前需要确认`;
      } else {
        msgEl.textContent = `⚠️ 检测到数据修改操作: ${danger.type} — 请确认 SQL 无误`;
      }
    } else {
      editor.classList.remove('danger-sql');
      banner.classList.remove('show');
    }
    return danger;
  },

  getSQLToExecute() {
    const editor = document.getElementById('sql-editor');
    let sql = editor.value.substring(editor.selectionStart, editor.selectionEnd).trim();
    if (!sql) sql = editor.value.trim();
    return sql;
  },

  closeDangerModal() {
    document.getElementById('danger-modal').classList.remove('show');
    this.pendingDangerSQL = null;
  },

  confirmDangerSQL() {
    document.getElementById('danger-modal').classList.remove('show');
    const sql = this.pendingDangerSQL;
    this.pendingDangerSQL = null;
    if (sql) this._doExecuteSQL(sql);
  },

  // ── SQL Execution ──
  async executeSQL() {
    const conn = this.getActiveConn();
    if (!conn) { alert('请先选择并连接数据库'); return; }
    if (!this.currentDB) { alert('请先在左侧选择一个数据库'); return; }
    const sql = this.getSQLToExecute();
    if (!sql) return;

    // Check danger level — all UPDATE/DELETE/DROP/TRUNCATE/ALTER require confirmation
    const danger = this.getDangerLevel(sql);
    if (danger) {
      // Show danger confirmation for ALL levels
      const hintEl = document.getElementById('danger-hint');
      const codeEl = document.getElementById('danger-code');
      const btnEl = document.getElementById('btn-danger-confirm');

      if (danger.level === 'high') {
        if (danger.type.includes('无 WHERE')) {
          hintEl.innerHTML = `<strong>检测到 ${danger.type} 操作！</strong><br><br>该语句<strong>没有 WHERE 条件</strong>，将影响表中所有数据。<br>这是一个不可逆的操作，请仔细确认。`;
        } else {
          hintEl.innerHTML = `<strong>检测到危险操作: ${danger.type}</strong><br><br>该操作可能造成数据丢失，请仔细确认。`;
        }
        btnEl.textContent = '我确认，执行';
      } else {
        hintEl.innerHTML = `<strong>检测到数据修改操作: ${danger.type}</strong><br><br>该操作将修改数据库中的数据，请确认是否继续。`;
        btnEl.textContent = '确认执行';
      }
      codeEl.textContent = sql;
      this.pendingDangerSQL = sql;
      document.getElementById('danger-modal').classList.add('show');
      return;
    }

    this._doExecuteSQL(sql);
  },

  async _doExecuteSQL(sql) {
    const conn = this.getActiveConn();
    if (!conn) return;

    this.showLoading('执行中...');
    this.switchTab('results');

    try {
      const data = await this.api('/api/execute', {
        dbType: conn.dbType,
        host: conn.host,
        port: conn.port,
        user: conn.user,
        password: conn.password,
        database: this.currentDB,
        sql: sql
      });

      if (data.error) {
        this.renderError(data.error);
        this.log('exec', `执行失败: ${data.error}`, 'error');
      } else {
        this.renderResults(data);
        const rowCount = data.rows ? data.rows.length : 0;
        const affected = data.rowsAffected || 0;
        if (data.columns && data.columns.length > 0) {
          this.log('exec', `查询成功: ${rowCount} 行 · 耗时 ${data.elapsed}`, 'success');
        } else {
          this.log('exec', `执行成功: 影响 ${affected} 行 · 耗时 ${data.elapsed}`, 'success');
        }
      }
    } catch(e) {
      this.renderError(e.message);
      this.log('exec', `请求失败: ${e.message}`, 'error');
    }
    this.hideLoading();
  },

  renderResults(data) {
    const body = document.getElementById('result-body');
    if (!data.columns || data.columns.length === 0) {
      const html = `
        <div class="empty-state">
          <div class="empty-icon">✅</div>
          <div>执行成功</div>
          <div class="empty-hint">影响 ${data.rowsAffected || 0} 行 · 耗时 ${data.elapsed}</div>
        </div>`;
      this.cachedResultHTML = html;
      body.innerHTML = html;
      document.getElementById('badge-results').textContent = '0';
      return;
    }
    const cols = data.columns;
    const rows = data.rows || [];
    this.lastResultData = { columns: cols, rows: rows };
    document.getElementById('badge-results').textContent = rows.length;

    const pkCols = new Set();
    if (this.structData) {
      this.structData.forEach(c => { if (c.is_pk) pkCols.add(c.name); });
    }

    let html = '<table class="result-table"><thead><tr>';
    html += '<th class="col-num">#</th>';
    cols.forEach(col => {
      const isPK = pkCols.has(col);
      html += `<th>${col}${isPK ? ' <span class="th-type">🔑PK</span>' : ''}</th>`;
    });
    html += '</tr></thead><tbody>';

    rows.forEach((row, idx) => {
      const rowKey = row[0] !== undefined ? String(row[0]) : idx;
      html += `<tr data-row-index="${idx}" data-row-key="${rowKey.replace(/"/g,'&quot;')}" oncontextmenu="App.onRowContextMenu(event, this)">`;
      html += `<td class="col-num">${idx + 1}</td>`;
      row.forEach(val => {
        if (val === null || val === undefined) {
          html += '<td class="null-val">NULL</td>';
        } else if (typeof val === 'number') {
          html += `<td class="num-val">${val}</td>`;
        } else {
          const escaped = String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          html += `<td title="${escaped}">${escaped}</td>`;
        }
      });
      html += '</tr>';
    });

    if (rows.length === 0) {
      html += `<tr><td class="col-num"></td><td colspan="${cols.length}" style="text-align:center;padding:20px;color:var(--text-3)">查询返回 0 行</td></tr>`;
    }
    html += '</tbody></table>';
    html += `<div style="padding:6px 12px;font-size:11px;color:var(--text-3);border-top:1px solid var(--border)">
      ${rows.length} 行 · 耗时 ${data.elapsed}${rows.length >= 1000 ? ' (已限制 1000 行)' : ''}
    </div>`;
    this.cachedResultHTML = html;
    body.innerHTML = html;
  },

  renderError(msg) {
    const body = document.getElementById('result-body');
    body.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">❌</div>
        <div style="color:var(--danger)">执行错误</div>
        <div class="empty-hint" style="color:var(--danger);white-space:pre-wrap;max-width:600px">${msg}</div>
      </div>`;
    document.getElementById('badge-results').textContent = '0';
  },

  // ── Editor ──
  initEditor() {
    const editor = document.getElementById('sql-editor');
    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        this.executeSQL();
      }
      if (e.key === 'Tab' || e.key === ' ') {
        const result = this.expandSnippet(editor);
        if (result) {
          e.preventDefault();
          editor.selectionStart = editor.selectionEnd = result.cursorPos;
        } else if (e.key === 'Tab') {
          e.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
          editor.selectionStart = editor.selectionEnd = start + 2;
        }
      }
    });
    // Check danger on input
    editor.addEventListener('input', () => this.checkDangerSQL());
    editor.addEventListener('keyup', () => {
      this.checkDangerSQL();
      const pos = editor.selectionStart;
      const text = editor.value.substring(0, pos);
      const line = text.split('\n').length;
      const col = pos - text.lastIndexOf('\n');
      document.getElementById('editor-pos').textContent = `Ln ${line}, Col ${col}`;
    });
    editor.addEventListener('click', () => {
      const pos = editor.selectionStart;
      const text = editor.value.substring(0, pos);
      const line = text.split('\n').length;
      const col = pos - text.lastIndexOf('\n');
      document.getElementById('editor-pos').textContent = `Ln ${line}, Col ${col}`;
    });
  },

  expandSnippet(editor) {
    const pos = editor.selectionStart;
    const textBefore = editor.value.substring(0, pos);
    // Find the start of the word before cursor
    const lastSpace = Math.max(
      textBefore.lastIndexOf(' '),
      textBefore.lastIndexOf('\n'),
      textBefore.lastIndexOf('\t')
    );
    const abbr = textBefore.substring(lastSpace + 1, pos).toLowerCase();
    const snippet = this.snippets[abbr];
    if (!snippet) return null;

    // Get current connection dbType for dialect-aware expansion
    const conn = this.getActiveConn();
    const dbType = conn ? conn.dbType : 'mysql';

    // Resolve expansion
    let expanded = typeof snippet === 'function' ? snippet(dbType) : snippet;

    // Replace the abbreviation in the full text
    const before = editor.value.substring(0, lastSpace + 1);
    const after = editor.value.substring(pos);
    // If user typed a space/Tab to trigger, we consume that trigger char
    // (The default space/Tab insertion is prevented by the caller)
    editor.value = before + expanded + after;

    // Place cursor at end of expanded text
    const newCursor = (lastSpace + 1) + expanded.length;
    this.checkDangerSQL();
    this.log('message', '展开 snippet: ' + abbr + ' → ' + expanded, 'info');
    return { cursorPos: newCursor };
  },

  formatSQL() {
    const editor = document.getElementById('sql-editor');
    let sql = editor.value;
    if (!sql.trim()) return;
    const keywords = ['SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'ORDER BY', 'GROUP BY', 'HAVING', 'LIMIT', 'INSERT INTO', 'VALUES', 'UPDATE', 'SET', 'DELETE FROM', 'CREATE TABLE', 'ALTER TABLE', 'ADD', 'DROP', 'INNER JOIN', 'LEFT JOIN', 'RIGHT JOIN', 'ON'];
    keywords.forEach(kw => {
      const re = new RegExp('\\b' + kw.replace(' ', '\\s+') + '\\b', 'gi');
      sql = sql.replace(re, kw);
    });
    sql = sql.replace(/\s+(FROM|WHERE|ORDER BY|GROUP BY|HAVING|LIMIT|VALUES|SET|INNER JOIN|LEFT JOIN|RIGHT JOIN|ON)/gi, '\n$1');
    editor.value = sql;
    this.checkDangerSQL();
    this.log('message', 'SQL 已格式化', 'info');
  },

  clearEditor() {
    document.getElementById('sql-editor').value = '';
    document.getElementById('sql-editor').classList.remove('danger-sql');
    document.getElementById('danger-banner').classList.remove('show');
    this.cachedResultHTML = null;
    this.lastResultData = null;
    document.getElementById('result-body').innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div><div>暂无结果</div><div class="empty-hint">执行 SQL 查询或点击左侧表名查看数据</div></div>';
    document.getElementById('badge-results').textContent = '0';
  },

  // ── Tab Switching ──
  switchTab(tab) {
    const body = document.getElementById('result-body');
    // Cache current content before switching away from results
    if (this.activeTab === 'results' && tab !== 'results') {
      this.cachedResultHTML = body.innerHTML;
    }
    this.activeTab = tab;
    document.querySelectorAll('.result-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
    if (tab === 'results') {
      body.innerHTML = this.cachedResultHTML || '<div class="empty-state"><div class="empty-icon">📊</div><div>暂无结果</div><div class="empty-hint">执行 SQL 查询或点击左侧表名查看数据</div></div>';
    } else if (tab === 'structure') {
      this.renderStructureTab();
    } else if (tab === 'messages') {
      this.renderMessages();
    }
  },

  // ── Message Log ──
  log(type, message, level) {
    if (!this.messages) this.messages = [];
    const time = new Date().toLocaleTimeString('zh-CN', {hour12: false});
    this.messages.push({type, message, level: level || 'info', time});
    if (this.messages.length > 200) this.messages = this.messages.slice(-200);
    if (this.activeTab === 'messages') this.renderMessages();
    document.getElementById('editor-info').textContent = message;
  },

  renderMessages() {
    const body = document.getElementById('result-body');
    const msgs = this.messages || [];
    if (msgs.length === 0) {
      body.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div><div>暂无消息</div></div>';
      return;
    }
    let html = '<div class="message-log">';
    msgs.forEach(m => {
      html += `<div class="msg-${m.level}"><span class="msg-time">[${m.time}]</span>${m.message}</div>`;
    });
    html += '</div>';
    body.innerHTML = html;
    body.scrollTop = body.scrollHeight;
  },

  // ── Section Toggle ──
  toggleSection(id) {
    const section = document.getElementById(id);
    const header = section.querySelector('.section-header');
    header.classList.toggle('collapsed');
    section.classList.toggle('collapsed');
  },

  // ── Resizers (using pointer events + setPointerCapture for iframe compat) ──
  initResizers() {
    // Vertical resizer (left panel <-> center)
    this._initResizerV('resizer-left', 'left-panel', 'e.clientX', true);
    // Horizontal resizer (editor <-> results)
    this._initResizerH('resizer-h', 'editor-section', 'editorHeight');
  },

  _initResizerV(resizerId, panelId, clientAxis, isLeft) {
    const resizer = document.getElementById(resizerId);
    const panel = document.getElementById(panelId);
    let startX, startWidth;

    resizer.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resizer.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startWidth = panel.offsetWidth;
      resizer.classList.add('dragging');

      resizer.onpointermove = (e) => {
        const dx = e.clientX - startX;
        const newW = startWidth + dx;
        panel.style.width = Math.max(180, Math.min(420, newW)) + 'px';
      };

      resizer.onpointerup = () => {
        resizer.classList.remove('dragging');
        resizer.onpointermove = null;
        resizer.onpointerup = null;
      };
    });
  },

  _initResizerH(resizerId, editorSectionId, storageKey) {
    const resizer = document.getElementById(resizerId);
    const editorSection = document.getElementById(editorSectionId);
    const resultsSection = document.getElementById('results-section');
    let startY, startHeight;

    resizer.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      resizer.setPointerCapture(e.pointerId);
      startY = e.clientY;
      startHeight = resultsSection.offsetHeight;
      resizer.classList.add('dragging');

      resizer.onpointermove = (e) => {
        const dy = startY - e.clientY;
        const newH = Math.max(120, startHeight + dy);
        const maxH = window.innerHeight - 150;
        resultsSection.style.height = Math.min(maxH, newH) + 'px';
        // Editor section gets the rest via flex
      };

      resizer.onpointerup = () => {
        resizer.classList.remove('dragging');
        resizer.onpointermove = null;
        resizer.onpointerup = null;
      };
    });
  },

  // ── Fullscreen ──
  initFullscreen() {
    document.addEventListener('fullscreenchange', () => this._onFullscreenChange());
    document.addEventListener('webkitfullscreenchange', () => this._onFullscreenChange());
  },

  toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  },

  _onFullscreenChange() {
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const btn = document.getElementById('fs-btn');
    if (isFS) {
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m13-5h-3a2 2 0 0 0-2 2v3"/></svg>';
      btn.title = '退出全屏 (Esc)';
      btn.classList.add('fullscreen-active');
    } else {
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>';
      btn.title = '全屏查看';
      btn.classList.remove('fullscreen-active');
    }
  },

  // ── Table Context Menu ──
  onTableContextMenu(e, dbName, tableName) {
    e.preventDefault();
    e.stopPropagation();
    this.contextTableDB = dbName;
    this.contextTableName = tableName;

    const menu = document.getElementById('table-context-menu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('show');

    const hideMenu = () => {
      menu.classList.remove('show');
      document.removeEventListener('click', hideMenu);
    };
    setTimeout(() => document.addEventListener('click', hideMenu), 0);
  },

  runTableQuery(limit) {
    const tableName = this.contextTableName;
    if (!tableName) return;
    const conn = this.getActiveConn();
    const editor = document.getElementById('sql-editor');
    if (conn && conn.dbType === 'mssql') {
      editor.value = `SELECT TOP ${limit} * FROM ${tableName};`;
    } else {
      editor.value = `SELECT * FROM ${tableName} LIMIT ${limit};`;
    }
    this.checkDangerSQL();
    this.executeSQL();
  },

  genInsertSQL() {
    const tableName = this.contextTableName;
    if (!tableName) return;
    const editor = document.getElementById('sql-editor');
    const cols = this.structData || [];
    if (cols.length === 0) {
      editor.value = `INSERT INTO ${tableName} (column1, column2) VALUES (value1, value2);`;
    } else {
      const colNames = cols.map(c => c.name).join(', ');
      const placeholders = cols.map(() => '?').join(', ');
      editor.value = `INSERT INTO ${tableName} (${colNames}) VALUES (${placeholders});`;
    }
    this.checkDangerSQL();
    this.log('message', `已生成 INSERT 模板: ${tableName}`, 'info');
  },

  // ── Row Context Menu ──
  onRowContextMenu(e, rowEl) {
    e.preventDefault();
    e.stopPropagation();
    const rowIndex = parseInt(rowEl.dataset.rowIndex);
    if (isNaN(rowIndex)) return;

    // Store context for the menu action
    this.contextRowIndex = rowIndex;

    // Show context menu at cursor position
    const menu = document.getElementById('context-menu');
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('show');

    // Hide on click elsewhere
    const hideMenu = () => {
      menu.classList.remove('show');
      document.removeEventListener('click', hideMenu);
    };
    setTimeout(() => document.addEventListener('click', hideMenu), 0);
  },

  showRowDetail() {
    const data = this.lastResultData;
    if (!data || !data.columns || !data.rows || this.contextRowIndex === undefined) return;
    const row = data.rows[this.contextRowIndex];
    if (!row) return;

    let html = '<table class="row-detail-table"><tbody>';
    data.columns.forEach((col, i) => {
      const val = row[i];
      let display;
      if (val === null || val === undefined) {
        display = '<span class="null-val">NULL</span>';
      } else if (typeof val === 'number') {
        display = `<span class="num-val">${val}</span>`;
      } else {
        display = String(val).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      html += `<tr><th>${col}</th><td>${display}</td></tr>`;
    });
    html += '</tbody></table>';

    document.getElementById('row-detail-body').innerHTML = html;
    document.getElementById('row-detail-modal').classList.add('show');
  },

  closeRowDetail() {
    document.getElementById('row-detail-modal').classList.remove('show');
    this.contextRowIndex = undefined;
  },

  // ── Loading ──
  showLoading(text) {
    document.getElementById('loading-text').textContent = text || '加载中...';
    document.getElementById('loading').style.display = 'flex';
  },
  hideLoading() {
    document.getElementById('loading').style.display = 'none';
  }
};

App.init();
</script>
