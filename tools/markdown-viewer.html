<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Markdown 可视化工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f1f5f9; --surface:#fff; --border:#e2e8f0; --text:#1e293b; --text-2:#64748b; --text-3:#94a3b8;
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-light:#eff6ff;
  --success:#16a34a; --success-light:#f0fdf4; --success-text:#166534;
  --code-bg:#f8fafc; --code-border:#e2e8f0;
  --preview-bg:#fff;
}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Header */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;flex-shrink:0}
header h1{font-size:18px;font-weight:600;color:#0f172a;display:flex;align-items:center;gap:8px}
header h1 .icon{font-size:20px}
header p{font-size:13px;color:var(--text-2);margin-top:3px}

/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:8px}
.toolbar-right{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid var(--border)}
.btn-secondary:hover{background:#e2e8f0}
.btn-sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Format switcher */
.format-group{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden;background:#f8fafc}
.format-group .fmt-label{padding:5px 10px;font-size:12px;color:var(--text-2);font-weight:600;border-right:1px solid var(--border);background:#f8fafc}
.format-btn{padding:6px 14px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:500;color:var(--text-2);transition:all .15s}
.format-btn:hover{background:#e8f0fe}
.format-btn.active{background:var(--primary);color:#fff;font-weight:600}

/* Split layout */
.split-layout{flex:1;display:flex;min-height:0;overflow:hidden}
.editor-panel{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.preview-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--preview-bg)}

.panel-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#f8fafc;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-header .title{font-size:12px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:6px}
.panel-header .title .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
.preview-panel .panel-header .title .dot{background:var(--success)}
.panel-header .word-count{font-size:11px;color:var(--text-3)}

/* Editor */
.editor-wrap{flex:1;position:relative;min-height:0}
.editor-area{width:100%;height:100%;border:none;outline:none;resize:none;padding:16px 20px;font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:13px;line-height:1.7;color:var(--text);background:var(--surface);tab-size:2}
.editor-area::placeholder{color:var(--text-3)}
.drop-zone{position:absolute;inset:0;border:2px dashed transparent;border-radius:8px;transition:all .2s;pointer-events:none;display:flex;align-items:center;justify-content:center}
.drop-zone.dragover{border-color:var(--primary);background:rgba(37,99,235,.06);pointer-events:auto}
.drop-zone.dragover .drop-hint{display:flex}
.drop-hint{display:none;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--primary)}

/* Preview */
.preview-wrap{flex:1;overflow-y:auto;padding:24px 32px;min-height:0}
.preview-empty{text-align:center;color:var(--text-3);padding:60px 24px}
.preview-empty .emoji{font-size:40px;margin-bottom:8px}
.preview-empty .hint{font-size:13px}

/* Markdown rendered styles (GitHub-like) */
.markdown-body{font-size:14px;line-height:1.7;color:var(--text);word-wrap:break-word}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6{margin-top:24px;margin-bottom:16px;font-weight:600;line-height:1.3}
.markdown-body h1{font-size:1.9em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.markdown-body h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}
.markdown-body h3{font-size:1.25em}
.markdown-body h4{font-size:1em}
.markdown-body h5{font-size:.875em}
.markdown-body h6{font-size:.85em;color:var(--text-2)}
.markdown-body p{margin-top:0;margin-bottom:16px}
.markdown-body a{color:var(--primary);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body strong{font-weight:600}
.markdown-body em{font-style:italic}
.markdown-body del{text-decoration:line-through}
.markdown-body ul,.markdown-body ol{margin-top:0;margin-bottom:16px;padding-left:2em}
.markdown-body li{margin-top:4px}
.markdown-body ul ul,.markdown-body ul ol,.markdown-body ol ul,.markdown-body ol ol{margin-top:4px;margin-bottom:0}
.markdown-body input[type=checkbox]{margin-right:6px;transform:translateY(1px)}
.markdown-body blockquote{padding:0 16px;margin:0 0 16px;color:var(--text-2);border-left:4px solid var(--border)}
.markdown-body blockquote>:first-child{margin-top:0}
.markdown-body blockquote>:last-child{margin-bottom:0}
.markdown-body code{font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:85%;background:rgba(175,184,193,.2);padding:.2em .4em;border-radius:4px}
.markdown-body pre{font-family:"Cascadia Code","Fira Code",Consolas,monospace;font-size:13px;line-height:1.6;background:#f6f8fa;border:1px solid var(--code-border);border-radius:8px;padding:16px;overflow:auto;margin-bottom:16px}
.markdown-body pre code{font-size:100%;background:none;padding:0;border-radius:0}
.markdown-body table{display:block;width:100%;overflow:auto;margin-top:0;margin-bottom:16px;border-collapse:collapse}
.markdown-body table th,.markdown-body table td{padding:8px 13px;border:1px solid var(--border)}
.markdown-body table th{font-weight:600;background:#f8fafc}
.markdown-body table tr{background:var(--surface);border-top:1px solid var(--border)}
.markdown-body table tr:nth-child(2n){background:#f8fafc}
.markdown-body hr{height:1px;margin:24px 0;border:none;border-top:1px solid var(--border)}
.markdown-body img{max-width:100%;border-radius:8px}
.markdown-body .task-list-item{list-style-type:none}
.markdown-body .task-list-item input{margin:0 .5em .25em -1.4em;vertical-align:middle}

/* PDF export: avoid page breaks cutting through text */
.markdown-body.pdf-export h1,
.markdown-body.pdf-export h2,
.markdown-body.pdf-export h3,
.markdown-body.pdf-export h4,
.markdown-body.pdf-export h5,
.markdown-body.pdf-export h6,
.markdown-body.pdf-export p,
.markdown-body.pdf-export li,
.markdown-body.pdf-export blockquote,
.markdown-body.pdf-export pre,
.markdown-body.pdf-export table,
.markdown-body.pdf-export img,
.markdown-body.pdf-export hr{
  page-break-inside:avoid;
  break-inside:avoid;
}
.markdown-body.pdf-export h1,
.markdown-body.pdf-export h2,
.markdown-body.pdf-export h3{
  page-break-after:avoid;
  break-after:avoid;
}
.markdown-body.pdf-export tr{
  page-break-inside:avoid;
  break-inside:avoid;
}

/* Alert */
.alert{padding:10px 14px;border-radius:7px;font-size:13px;margin:0 24px 12px;display:none}
.alert.show{display:block}
.alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}

/* Fullscreen mode */
.fs-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--text-2);transition:all .15s;flex-shrink:0}
.fs-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.fs-btn svg{width:14px;height:14px}
.fs-btn.fullscreen-active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* Fullscreen exit button (visible only in fullscreen) */
.fs-exit-btn{display:none;align-items:center;justify-content:center;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--text-2);font-size:11px;font-weight:500;gap:4px;transition:all .15s}
.fs-exit-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.fs-exit-btn svg{width:12px;height:12px}

/* Navigation flash */
@keyframes nav-flash{0%{background:#fde68a}100%{background:transparent}}
.markdown-body .flash{animation:nav-flash 1.5s ease;border-radius:4px}

/* Divider resizer */
.resizer{width:4px;cursor:col-resize;background:transparent;flex-shrink:0;transition:background .15s;z-index:5}
.resizer:hover,.resizer.dragging{background:var(--primary)}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* Responsive */
@media(max-width:768px){
  .split-layout{flex-direction:column}
  .editor-panel{border-right:none;border-bottom:1px solid var(--border);min-height:200px}
  .preview-panel{min-height:200px}
  .toolbar{padding:8px 12px}
  .toolbar-left,.toolbar-right{flex-wrap:wrap}
}
</style>
</head>
<body>

<header>
  <h1><span class="icon">&#128221;</span> Markdown 可视化工具</h1>
  <p>粘贴或上传 Markdown 文件，实时预览渲染效果，支持导出 MD / HTML / PDF</p>
</header>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn btn-secondary btn-sm" onclick="App.uploadFile()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      上传文件
    </button>
    <button class="btn btn-secondary btn-sm" onclick="App.loadSample()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      示例
    </button>
    <button class="btn btn-secondary btn-sm" onclick="App.clearAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      清空
    </button>
    <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none" onchange="App.handleFileSelect(event)">
  </div>
  <div class="toolbar-right">
    <div class="format-group">
      <span class="fmt-label">导出</span>
      <button class="format-btn active" data-format="md" onclick="App.setFormat('md')">MD</button>
      <button class="format-btn" data-format="html" onclick="App.setFormat('html')">HTML</button>
      <button class="format-btn" data-format="pdf" onclick="App.setFormat('pdf')">PDF</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="App.exportContent()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      下载
    </button>
  </div>
</div>

<div class="alert" id="alert"></div>

<!-- Split layout -->
<div class="split-layout">
  <!-- Editor -->
  <div class="editor-panel" id="editor-panel">
    <div class="panel-header">
      <div class="title"><span class="dot"></span> Markdown 源码</div>
      <div class="word-count" id="word-count">0 字 · 0 行</div>
    </div>
    <div class="editor-wrap">
      <textarea class="editor-area" id="editor" placeholder="在此粘贴 Markdown 内容...

支持语法：
# 标题  **加粗**  *斜体*  ~~删除线~~
- 列表  1. 有序列表  [x] 任务
> 引用  `行内代码`  ```代码块```
| 表格 | 语法 |  [链接](url)  ![图片](url)

也可点击左上角「上传文件」加载 .md 文件" oninput="App.render()"></textarea>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-hint">&#128193; 松开以加载文件</div>
      </div>
    </div>
  </div>

  <!-- Resizer -->
  <div class="resizer" id="resizer"></div>

  <!-- Preview -->
  <div class="preview-panel">
    <div class="panel-header">
      <div class="title"><span class="dot"></span> 渲染预览</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="word-count" id="render-info"></div>
        <button class="fs-btn" id="fs-btn" onclick="App.toggleFullscreen()" title="全屏查看">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
        </button>
      </div>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <div class="preview-empty" id="preview-empty">
        <div class="emoji">&#128064;</div>
        <div class="hint">在左侧输入 Markdown 后，渲染结果将显示在此</div>
      </div>
      <div class="markdown-body" id="preview" style="display:none"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<script>
(function(){
'use strict';

const App = {
  currentFormat: 'md',
  isFullscreen: false,
  editor: null,
  preview: null,
  previewEmpty: null,
  previewWrap: null,
  previewPanel: null,
  fsBtn: null,
  alert: null,
  wordCount: null,
  renderInfo: null,

  init() {
    this.editor = document.getElementById('editor');
    this.preview = document.getElementById('preview');
    this.previewEmpty = document.getElementById('preview-empty');
    this.previewWrap = document.getElementById('preview-wrap');
    this.previewPanel = document.querySelector('.preview-panel');
    this.fsBtn = document.getElementById('fs-btn');
    this.alert = document.getElementById('alert');
    this.wordCount = document.getElementById('word-count');
    this.renderInfo = document.getElementById('render-info');

    // Configure marked
    if (typeof marked !== 'undefined') {
      marked.setOptions({
        breaks: true,
        gfm: true,
      });
    }

    // Setup resizer
    this.initResizer();

    // Setup drag-drop
    this.initDragDrop();

    // Click-to-navigate: editor → preview, preview → editor
    this.editor.addEventListener('click', () => this.onEditorClick());
    this.preview.addEventListener('click', (e) => this.onPreviewClick(e));

    // Setup keyboard shortcut: Ctrl/Cmd+S to export (ESC exits natively via browser fullscreen)
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        this.exportContent();
      }
    });

    // Fullscreen change listener
    document.addEventListener('fullscreenchange', () => this._onFullscreenChange());
    document.addEventListener('webkitfullscreenchange', () => this._onFullscreenChange());
  },

  // ── Rendering ──
  render() {
    const md = this.editor.value;
    this.updateWordCount(md);

    if (!md.trim()) {
      this.preview.style.display = 'none';
      this.previewEmpty.style.display = 'block';
      this.renderInfo.textContent = '';
      return;
    }

    try {
      const rawHtml = marked.parse(md);
      const cleanHtml = DOMPurify.sanitize(rawHtml, {
        ADD_ATTR: ['target', 'rel'],
        FORBID_TAGS: ['script'],
        FORBID_ATTR: ['on*'],
      });
      this.preview.innerHTML = cleanHtml;
      // Make links open in new tab
      this.preview.querySelectorAll('a').forEach(a => {
        if (!a.getAttribute('target')) a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });
      this.preview.style.display = 'block';
      this.previewEmpty.style.display = 'none';

      const blocks = this.preview.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,pre,table,blockquote,img,hr').length;
      this.renderInfo.textContent = blocks + ' 个元素';
      this.hideAlert();
    } catch (err) {
      this.showAlert('渲染出错: ' + err.message);
    }
  },

  updateWordCount(md) {
    const chars = md.length;
    const lines = md.split('\n').length;
    this.wordCount.textContent = chars + ' 字 · ' + lines + ' 行';
  },

  // ── Bidirectional navigation ──

  // Editor click → locate in preview
  onEditorClick() {
    const md = this.editor.value;
    if (!md.trim() || this.preview.style.display === 'none') return;

    const pos = this.editor.selectionStart;
    const before = md.substring(0, pos);
    const lineNum = before.split('\n').length - 1;
    const lines = md.split('\n');
    const line = lines[lineNum] || '';
    const trimmed = line.trim();

    if (!trimmed) return;

    const elements = this.preview.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,pre,blockquote,table,hr,img');

    // Heading: # text
    if (/^#{1,6}\s/.test(trimmed)) {
      const headingText = trimmed.replace(/^#{1,6}\s+/, '').trim();
      for (const el of elements) {
        if (/^H[1-6]$/.test(el.tagName) && el.textContent.trim() === headingText) {
          this.scrollToPreviewElement(el);
          return;
        }
      }
    }

    // List item: - text / * text / 1. text
    if (/^[-*+]\s/.test(trimmed) || /^\d+\.\s/.test(trimmed)) {
      const itemText = trimmed.replace(/^[-*+]\s+|^\d+\.\s+/, '').trim();
      for (const el of elements) {
        if (el.tagName === 'LI') {
          const elText = el.textContent.trim();
          if (elText === itemText || elText.includes(itemText) || itemText.includes(elText)) {
            this.scrollToPreviewElement(el);
            return;
          }
        }
      }
    }

    // Code block: ```
    if (/^```/.test(trimmed)) {
      for (const el of elements) {
        if (el.tagName === 'PRE') { this.scrollToPreviewElement(el); return; }
      }
    }

    // Blockquote: > text
    if (/^>\s?/.test(trimmed)) {
      const quoteText = trimmed.replace(/^>\s*/, '').trim();
      for (const el of elements) {
        if (el.tagName === 'BLOCKQUOTE') {
          const elText = el.textContent.trim();
          if (!quoteText || elText.includes(quoteText) || quoteText.includes(elText)) {
            this.scrollToPreviewElement(el); return;
          }
        }
      }
    }

    // Table row: | text
    if (/^\|/.test(trimmed)) {
      for (const el of elements) {
        if (el.tagName === 'TABLE') { this.scrollToPreviewElement(el); return; }
      }
    }

    // Horizontal rule: --- / ***
    if (/^(---+|\*\*\*+)$/.test(trimmed)) {
      for (const el of elements) {
        if (el.tagName === 'HR') { this.scrollToPreviewElement(el); return; }
      }
    }

    // General text matching
    for (const el of elements) {
      const elText = el.textContent.trim();
      if (elText && (elText.includes(trimmed) || trimmed.includes(elText))) {
        this.scrollToPreviewElement(el);
        return;
      }
    }
  },

  // Preview click → locate in editor
  onPreviewClick(e) {
    const md = this.editor.value;
    if (!md.trim()) return;

    // Don't interfere with link or checkbox clicks
    if (e.target.closest('a') || e.target.tagName === 'INPUT') return;

    const el = e.target.closest('h1,h2,h3,h4,h5,h6,p,li,pre,blockquote,table,tr,img,hr,code');
    if (!el) return;

    const elText = el.textContent.trim();
    const lines = md.split('\n');

    // Headings
    if (/^H[1-6]$/.test(el.tagName)) {
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].trim();
        if (/^#{1,6}\s/.test(t)) {
          const mdHeading = t.replace(/^#{1,6}\s+/, '').trim();
          if (mdHeading === elText || mdHeading.includes(elText) || elText.includes(mdHeading)) {
            this.scrollToEditorLine(i); return;
          }
        }
      }
    }

    // List items
    if (el.tagName === 'LI') {
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].trim();
        if (/^[-*+]\s/.test(t) || /^\d+\.\s/.test(t)) {
          const mdItem = t.replace(/^[-*+]\s+|^\d+\.\s+/, '').trim();
          if (elText.includes(mdItem) || mdItem.includes(elText)) {
            this.scrollToEditorLine(i); return;
          }
        }
      }
    }

    // Code blocks
    if (el.tagName === 'PRE') {
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim().startsWith('```')) { this.scrollToEditorLine(i); return; }
      }
    }

    // Blockquotes
    if (el.tagName === 'BLOCKQUOTE') {
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim().startsWith('>')) { this.scrollToEditorLine(i); return; }
      }
    }

    // Tables
    if (el.tagName === 'TABLE' || el.tagName === 'TR') {
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].trim().startsWith('|')) { this.scrollToEditorLine(i); return; }
      }
    }

    // Horizontal rules
    if (el.tagName === 'HR') {
      for (let i = 0; i < lines.length; i++) {
        if (/^(---+|\*\*\*+)$/.test(lines[i].trim())) { this.scrollToEditorLine(i); return; }
      }
    }

    // General text matching
    if (elText) {
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].trim();
        if (t && (elText.includes(t) || t.includes(elText))) {
          this.scrollToEditorLine(i); return;
        }
      }
    }
  },

  scrollToPreviewElement(el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1500);
  },

  scrollToEditorLine(lineIndex) {
    const lines = this.editor.value.split('\n');
    let charPos = 0;
    for (let i = 0; i < lineIndex && i < lines.length; i++) {
      charPos += lines[i].length + 1;
    }
    this.editor.focus();
    const lineLength = (lines[lineIndex] || '').length;
    this.editor.setSelectionRange(charPos, charPos + lineLength);
    const lineHeight = 13 * 1.7;
    this.editor.scrollTop = Math.max(0, lineIndex * lineHeight - this.editor.clientHeight / 3);
  },

  // ── File operations ──
  uploadFile() {
    document.getElementById('file-input').click();
  },

  handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    this.readFile(file);
    event.target.value = ''; // reset for re-upload
  },

  readFile(file) {
    if (file.size > 5 * 1024 * 1024) {
      this.showAlert('文件过大（超过 5MB），请选择较小的文件');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      this.editor.value = e.target.result;
      this.render();
      this.hideAlert();
    };
    reader.onerror = () => this.showAlert('文件读取失败');
    reader.readAsText(file, 'UTF-8');
  },

  initDragDrop() {
    const dz = document.getElementById('drop-zone');
    const editor = this.editor;

    // Show drop zone when dragging over the editor area
    ['dragenter', 'dragover'].forEach(evt => {
      editor.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer.types.includes('Files')) {
          dz.classList.add('dragover');
        }
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      editor.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (evt === 'dragleave' && e.relatedTarget && editor.contains(e.relatedTarget)) return;
        dz.classList.remove('dragover');
      });
    });

    editor.addEventListener('drop', (e) => {
      const file = e.dataTransfer.files[0];
      if (file && /\.(md|markdown|txt)$/i.test(file.name)) {
        this.readFile(file);
      } else if (file) {
        this.showAlert('请拖入 .md / .markdown / .txt 文件');
      }
    });

    // Also handle drop on the drop zone itself
    dz.addEventListener('drop', (e) => {
      e.preventDefault();
      dz.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) this.readFile(file);
    });
    dz.addEventListener('dragover', (e) => { e.preventDefault(); });
  },

  // ── Format switching ──
  setFormat(fmt) {
    this.currentFormat = fmt;
    document.querySelectorAll('.format-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.format === fmt);
    });
  },

  // ── Fullscreen toggle (browser-level) ──
  toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    } else {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
    }
  },

  _onFullscreenChange() {
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
    this.isFullscreen = isFS;
    this.fsBtn.classList.toggle('fullscreen-active', isFS);
    if (isFS) {
      this.fsBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m13-5h-3a2 2 0 0 0-2 2v3"/></svg>';
      this.fsBtn.title = '退出全屏 (Esc)';
    } else {
      this.fsBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>';
      this.fsBtn.title = '全屏查看';
    }
  },

  // ── Export ──
  exportContent() {
    const md = this.editor.value;
    if (!md.trim()) {
      this.showAlert('没有内容可导出，请先输入 Markdown');
      return;
    }

    switch (this.currentFormat) {
      case 'md':
        this.exportMarkdown(md);
        break;
      case 'html':
        this.exportHTML(md);
        break;
      case 'pdf':
        this.exportPDF();
        break;
    }
  },

  exportMarkdown(md) {
    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    this.downloadBlob(blob, 'markdown-export.md');
  },

  exportHTML(md) {
    const bodyHtml = DOMPurify.sanitize(marked.parse(md), {
      ADD_ATTR: ['target', 'rel'],
      FORBID_TAGS: ['script'],
      FORBID_ATTR: ['on*'],
    });
    const html = this.buildStandaloneHTML(bodyHtml);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    this.downloadBlob(blob, 'markdown-export.html');
  },

  exportPDF() {
    if (typeof html2pdf === 'undefined') {
      this.showAlert('PDF 库未加载，请检查网络连接后重试');
      return;
    }
    if (!this.preview.innerHTML.trim()) {
      this.showAlert('没有可导出的内容');
      return;
    }

    // Clone the preview content into a temporary container for clean PDF export
    const tempContainer = document.createElement('div');
    // A4 content width ≈ 190 mm ≈ 718 px at 96 dpi, after 10 mm margins
    tempContainer.style.cssText = 'padding:0;background:#fff;width:718px;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;';
    const mdBody = document.createElement('div');
    // pdf-export class adds page-break-inside:avoid to prevent CJK text truncation
    mdBody.className = 'markdown-body pdf-export';
    mdBody.innerHTML = this.preview.innerHTML;
    tempContainer.appendChild(mdBody);

    const opt = {
      margin: [10, 10, 10, 10],
      filename: 'markdown-export.pdf',
      image: { type: 'jpeg', quality: 0.96 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        windowWidth: 718,
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      // avoid-all prevents page breaks inside text blocks; css respects explicit page-break
      pagebreak: { mode: ['avoid-all', 'css'] },
    };

    this.showAlert('正在生成 PDF，请稍候...', 'info');
    html2pdf().set(opt).from(tempContainer).save().then(() => {
      this.hideAlert();
    }).catch((err) => {
      this.showAlert('PDF 生成失败: ' + err.message);
    });
  },

  buildStandaloneHTML(bodyHtml) {
    const styles = this.extractStyles();
    return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Markdown 导出</title>
<style>
${styles}
body{margin:0;padding:40px;background:#fff}
</style>
</head>
<body>
<div class="markdown-body">
${bodyHtml}
</div>
</body>
</html>`;
  },

  extractStyles() {
    // Extract the markdown-body styles from this page
    const sheets = document.styleSheets;
    let css = '';
    for (const sheet of sheets) {
      try {
        const rules = sheet.cssRules;
        for (const rule of rules) {
          if (rule.cssText && rule.cssText.includes('markdown-body')) {
            css += rule.cssText + '\n';
          }
        }
      } catch(e) { /* cross-origin, skip */ }
    }
    // Fallback: minimal styles
    if (!css) {
      css = `
.markdown-body{font-size:14px;line-height:1.7;color:#1e293b;font-family:system-ui,sans-serif;word-wrap:break-word}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,.markdown-body h5,.markdown-body h6{margin-top:24px;margin-bottom:16px;font-weight:600;line-height:1.3}
.markdown-body h1{font-size:1.9em;padding-bottom:.3em;border-bottom:1px solid #e2e8f0}
.markdown-body h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid #e2e8f0}
.markdown-body h3{font-size:1.25em}
.markdown-body p{margin-top:0;margin-bottom:16px}
.markdown-body a{color:#2563eb;text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body strong{font-weight:600}
.markdown-body ul,.markdown-body ol{margin-top:0;margin-bottom:16px;padding-left:2em}
.markdown-body li{margin-top:4px}
.markdown-body blockquote{padding:0 16px;margin:0 0 16px;color:#64748b;border-left:4px solid #e2e8f0}
.markdown-body code{font-family:Consolas,monospace;font-size:85%;background:rgba(175,184,193,.2);padding:.2em .4em;border-radius:4px}
.markdown-body pre{font-family:Consolas,monospace;font-size:13px;line-height:1.6;background:#f6f8fa;border:1px solid #e2e8f0;border-radius:8px;padding:16px;overflow:auto;margin-bottom:16px}
.markdown-body pre code{font-size:100%;background:none;padding:0}
.markdown-body table{display:block;width:100%;overflow:auto;margin-bottom:16px;border-collapse:collapse}
.markdown-body table th,.markdown-body table td{padding:8px 13px;border:1px solid #e2e8f0}
.markdown-body table th{font-weight:600;background:#f8fafc}
.markdown-body table tr:nth-child(2n){background:#f8fafc}
.markdown-body hr{height:1px;margin:24px 0;border:none;border-top:1px solid #e2e8f0}
.markdown-body img{max-width:100%;border-radius:8px}
`;
    }
    return css;
  },

  downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 100);
  },

  // ── Sample / Clear ──
  loadSample() {
    this.editor.value = `# Markdown 可视化工具示例

## 代码块

  return b;

## 表格

| 功能 | 支持格式 | 说明 |

| 文本 | MD/HTML/PDF | 基础文本渲染 |
| 表格 | MD/HTML/PDF | GFM 表格语法 |

| 图片 | MD/HTML/PDF | 需网络可达 URL |

`;
    this.render();
  },

  clearAll() {
    this.editor.value = '';
    this.render();
    this.editor.focus();
  },

  // ── Alerts ──
  showAlert(msg, type) {
    this.alert.textContent = msg;
    this.alert.className = 'alert show';
    if (type === 'info') {
      this.alert.className = 'alert show';
      this.alert.style.background = '#eff6ff';
      this.alert.style.color = '#1e40af';
      this.alert.style.borderColor = '#bfdbfe';
    } else {
      this.alert.style.background = '';
      this.alert.style.color = '';
      this.alert.style.borderColor = '';
    }
    if (type !== 'info') {
      setTimeout(() => this.hideAlert(), 4000);
    }
  },

  hideAlert() {
    this.alert.className = 'alert';
    this.alert.style.background = '';
    this.alert.style.color = '';
    this.alert.style.borderColor = '';
  },

  // ── Resizer ──
  initResizer() {
    const resizer = document.getElementById('resizer');
    const editorPanel = document.getElementById('editor-panel');
    let isDragging = false;

    resizer.addEventListener('mousedown', (e) => {
      isDragging = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const container = resizer.parentElement;
      const rect = container.getBoundingClientRect();
      let newWidth = e.clientX - rect.left;
      // Clamp between 20% and 80%
      const min = rect.width * 0.2;
      const max = rect.width * 0.8;
      newWidth = Math.max(min, Math.min(max, newWidth));
      editorPanel.style.flex = 'none';
      editorPanel.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });
  },
};

window.App = App;
App.init();

})();
